# ruff configuration — what "ruff check" means in this repo.
# Read by ruff (and any IDE that speaks it). Without this file ruff wraps at 88
# columns and ignores import order; the project rule is
# E,F,W,I at ≤100 columns. Select Python by SHEBANG when invoking — most of
# the shipped tools have no .py extension, so a *.py glob sees 3 of 17.
line-length = 100

[lint]
select = ["E", "F", "W", "I"]
