# Interfaces NetworkManager must keep its hands off.
#
# WHAT READS THIS: NetworkManager, at start and on SIGHUP.
# CONSEQUENCE IF MISSING: NM claims every tap and mesh interface the
# hypervisor creates, tries to autoconnect them, fails, and raises a desktop
# notification for each one. Recording a fleet demo on 2026-09-06, "Connection
# failed — Activation of network connection failed" appeared on screen while
# forty-five microVMs were coming up. Nothing was actually broken: the guests
# were reachable the whole time, on interfaces NM had no business managing.
#
# Each pattern, and who creates it:
#   fc-*     kfire's tap per Firecracker microVM (kfire: tap_of)
#   ap-*     kvm-mesh's WireGuard interface per enrolled guest
#   vnet*    libvirt's tap per domain interface
#   type:wireguard  every wg link, however it was named
#
# These are all created, addressed and torn down by the tool that made them.
# NM managing them is not merely noisy — an autoconnect race against kfire
# destroying a tap is how an interface ends up half-removed.
[keyfile]
unmanaged-devices=interface-name:fc-*;interface-name:ap-*;interface-name:vnet*;interface-name:virbr*-nic;type:wireguard
