# 20-kldload-connectivity.conf — stop NetworkManager probing the internet
#
# Role: disables NetworkManager's periodic connectivity check.
# Read by: NetworkManager at start and on `systemctl reload NetworkManager`.
#
# WHY: Debian ships NM with connectivity checking ON, pointed at
# http://network-test.debian.org/nm. It re-runs on a timer and on every
# carrier or route change. On a machine that is air-gapped, behind a captive
# portal, or simply mid-install with no DHCP lease yet, that request fails
# every time — and each failure surfaces as a desktop notification. The
# operator installing from the ISO gets a stream of "activation of network
# connection failed" popups over the installer while nothing is actually
# wrong (reported during an install from 1.4.0-rc12).
#
# It is also wrong for this OS on principle: kldload installs with no network
# at all by design, so a background probe asking the internet whether the
# machine is online is both noise and an outbound request an air-gapped site
# did not ask for.
#
# Consequence if missing: the popups return, and NM reports state "connected
# (site only)" / "limited" on perfectly healthy networks that block the probe.
#
# What this does NOT do: it does not disable networking, DHCP, DNS, or
# autoconnect. Interfaces come up exactly as before. The only thing that stops
# is NM's opinion about whether the wider internet is reachable — which
# nothing in kldload consumes.
#
# To re-enable on a connected workstation:
#   enabled=true, then `systemctl reload NetworkManager`

[connectivity]
enabled=false
