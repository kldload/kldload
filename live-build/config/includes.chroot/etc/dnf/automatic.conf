# kldload security-only auto-updates.
#
# Per the update model (project_update-model.md): substrate is versionlocked
# (kernel / nvidia / zfs / bcc) AND userspace gets security-only automatic
# patches. dnf-automatic-install.timer fires nightly to apply ONLY security
# updates — never feature-version bumps, never the locked packages (versionlock
# wins over apply_updates). USB DR + reinstall is the only "upgrade" mechanism;
# this keeps userspace silently patched against CVEs in between.

[commands]
upgrade_type = security
random_sleep = 360
network_online_timeout = 60
download_updates = yes
apply_updates = yes
# reboot only on kernel CVE landing — security_severity = critical implies
# kernel reboot is acceptable. "when-needed" reboots iff the package list
# contains kernel-* or systemd; otherwise leaves the system running.
reboot = never
reboot_command = "shutdown -r +5 'Rebooting after security updates'"

[emitters]
emit_via = motd,stdio

[email]
email_from = root@localhost
email_to = root

[base]
debuglevel = 1
