[Settings]
# kldload: force dark theme system-wide for GTK4 apps.
# Libadwaita reads dconf color-scheme; non-libadwaita GTK4 apps still
# read this file (matches the GTK3 sibling). Belt-and-suspenders so
# every GTK toolkit version renders the same dark canvas instead of
# the OS-default light theme.
gtk-application-prefer-dark-theme=true
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
