# Pre-baked into the ISO so the systemd user manager reads it at first
# session start — before any user opens Nautilus. Without this, GTK4 apps
# (Nautilus, Settings, Software, etc.) segfault on first session in
# libnvidia-glcore.so via vkCreateImage() / VK_ERROR_FORMAT_NOT_SUPPORTED.
#
# Why ngl, not cairo:
#   - cairo is pure software (slow, no GPU at all) and was the original
#     workaround in kldload-firstboot.
#   - ngl is GTK4's OpenGL renderer — faster than cairo, exercises the
#     stable NVIDIA OpenGL stack instead of the Vulkan path that crashes.
#     Verified working on NVIDIA driver 610.43.02 + GTK4 Wayland session
#     (RTX 3080, onyx, 2026-06-04).
#
# kldload-firstboot still writes /etc/environment.d/60-kldload-nvidia-gsk.conf
# at first boot to keep the workaround idempotent on upgrades and on
# systems that weren't built from this ISO. If both files exist they say
# the same thing — no conflict.
#
# Override-friendly: if NVIDIA proprietary driver isn't installed at all,
# the variable is harmless (GTK4 just uses ngl on Mesa too). If you want
# to test the Vulkan renderer for benchmarking, comment this out, log
# out, log back in.
GSK_RENDERER=ngl
