[Service]
# Keep loaded models resident forever (default ollama behavior is to
# unload after 5 min of idle to free VRAM). Bob hides from the kldload
# SPA's sidebar when /api/ps reports empty (task #52 — "Bob nav item
# hidden until model resident in VRAM"), so when ollama unloads bob,
# the operator perceives him as gone.
#
# Operator on .142 b644 2026-06-07: "i dont see bob in the ui anymore"
# after ~1 hr of no SPA traffic. With ~9 GB VRAM held continuously on a
# 16 GB card, the trade is worth it: instant Bob from every chat, no
# 60-90 s cold load surprise, and no unexplained vanishings of the nav
# item between sessions.
Environment=OLLAMA_KEEP_ALIVE=-1
