[Service]
# Keep loaded models resident forever (default ollama behavior is to
# unload after 5 min of idle to free VRAM). Bob hides from the kldload
# SPA's sidebar when /api/ps reports empty (task #52 — "Bob nav item
# hidden until model resident in VRAM"), so when ollama unloads bob,
# the operator perceives him as gone.
#
# Operator on .142 b644 2026-06-07: "i dont see bob in the ui anymore"
# after ~1 hr of no SPA traffic. With ~9 GB VRAM held continuously on a
# 16 GB card, the trade is worth it: instant Bob from every chat, no
# 60-90 s cold load surprise, and no unexplained vanishings of the nav
# item between sessions.
Environment=OLLAMA_KEEP_ALIVE=-1

# Where the models actually live.
#
# The darksite weights are rehydrated to /srv/ollama/models — a ZFS dataset with
# room for a 9 GB model — but the ollama DAEMON defaults to
# /usr/share/ollama/.ollama/models and has no idea about the other directory.
# kldload-autodeploy exports OLLAMA_MODELS in its own shell, which only affects
# the CLI calls it makes, never the service.
#
# kldload-firstboot did write this, but only inside the branch that runs when
# firstboot INSTALLS ollama. Every profile that already ships ollama skipped
# that branch, so the daemon was never told. On .131 (2026-08-15) the result was
# 11 GB of correctly rehydrated models in /srv/ollama/models, a running daemon,
# and `ollama list` showing only the 274 MB embedding model that happened to sit
# in the default path — a darksite AI that could not answer a single prompt.
#
# Shipping it as a drop-in rather than generating it means the daemon is
# configured before anything else runs, on every install path, whether ollama
# came from the profile, the darksite or a network install.
Environment=OLLAMA_MODELS=/srv/ollama/models
