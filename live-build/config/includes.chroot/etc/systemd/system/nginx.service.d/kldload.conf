# kldload drop-in for the distro-shipped nginx.service.
#
# Two jobs:
#
#   1. ExecStartPre=/usr/local/sbin/kldload-tls-cert  — guarantees the
#      cert+key that nginx.conf references actually exist before nginx
#      tries to load them. On first boot the cert is generated here
#      (self-signed today, CA-signed once kldload-ca init has run).
#
#   2. After=network-online.target libvirtd.service kldload-tls-cert.service
#      — libvirt must be up so the virbr0 address (192.168.122.1) is
#      enumerable by kldload-tls-cert and lands in the leaf SAN list.
#      network-online.target ensures the LAN IP is present.
#
# The drop-in augments — does NOT replace — the distro unit. Package
# updates to nginx.service don't blow this away because it lives in
# /etc/systemd/system/nginx.service.d/ (admin-managed).

[Unit]
Description=nginx — kldload reverse proxy on :8443 with HTTP/2
Documentation=man:nginx(8) file:///etc/nginx/conf.d/kldload.conf
After=network-online.target kldload-tls-cert.service
Wants=network-online.target kldload-tls-cert.service

[Service]
# Prepend our cert-ensure step. systemd treats ExecStartPre= (empty)
# followed by ExecStartPre= as "reset then add" when combined with the
# distro's own ExecStartPre — we want BOTH: our cert-gen first, then
# the distro's `nginx -t` config test. Leaving the distro's in place.
ExecStartPre=/usr/local/sbin/kldload-tls-cert >/dev/null

# Reload on SIGHUP — graceful worker-restart preserves existing
# WebSocket sessions. kldload-bounce-tls-services + kldload-session
# both rely on this being a plain systemctl reload, not a restart.
ExecReload=/usr/sbin/nginx -s reload

# Restart on failure so a bad drop-in from kldload-session doesn't
# leave us serverless. RestartSec keeps us from tight-looping if the
# cert genuinely can't be generated.
Restart=on-failure
RestartSec=3s

[Install]
WantedBy=multi-user.target
