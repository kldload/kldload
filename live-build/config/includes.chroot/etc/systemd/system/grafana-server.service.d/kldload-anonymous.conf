# grafana-server drop-in — let the command center open a dashboard without a
# login wall.
#
# Read by: systemd, and through it grafana-server, which takes GF_* environment
# variables as overrides for the matching grafana.ini keys.
#
# WHY: the kldload command center opens four dashboards as frameless kiosk
# windows across the four workspaces. Grafana's default is to demand a login on
# every one of them, which on a single-operator appliance means four login
# forms where four dashboards should be — and a login form is not a dashboard.
# Anonymous access is VIEWER only, so it can read and cannot edit, and the
# admin account still exists for anything that changes state.
#
# WHY AN ENVIRONMENT DROP-IN rather than editing grafana.ini: the distro owns
# that file and replaces it on upgrade. A drop-in survives, applies to every
# substrate the same way, and `systemctl show grafana-server` reports the
# running configuration honestly.
#
# Consequence if missing: the command center opens and every panel is behind a
# login prompt. Nothing is broken; it is just unusable as a wall display.
[Service]
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
# The login form itself is still reachable at /login for the admin account;
# this only stops Grafana redirecting an anonymous viewer to it.
Environment=GF_AUTH_DISABLE_LOGIN_FORM=false
# Kiosk windows have no browser chrome and no back button, so a dashboard that
# decides to redirect somewhere is a dead end. Pin the home dashboard instead.
Environment=GF_USERS_DEFAULT_THEME=dark
