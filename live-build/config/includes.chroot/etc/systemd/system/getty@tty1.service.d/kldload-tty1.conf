# tty1 runs kldload-tty1, which is a plain agetty login on every installed
# system and a root autologin into `kld install` on the live medium booted
# with kldload.tui=1 (the USB's default entry since 2026-09-26). Removing
# this file gives back the stock getty on tty1 and nothing else changes.
[Service]
ExecStart=
ExecStart=-/usr/local/sbin/kldload-tty1 %I
