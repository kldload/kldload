# Disable node_exporter's bundled zfs collector (parser fails on newer
# kernels: "could not parse expected integer value for
# kstat.zfs.misc.arcstats.memory_available_bytes"). The arcstats-exporter
# textfile produces zfs_arcstat{metric=...} equivalents from the raw kstat.
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter --no-collector.zfs --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
