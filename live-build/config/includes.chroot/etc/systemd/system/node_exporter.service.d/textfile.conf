# Disable node_exporter's bundled zfs collector (parser fails on newer
# kernels: "could not parse expected integer value for
# kstat.zfs.misc.arcstats.memory_available_bytes"). The arcstats-exporter
# textfile produces zfs_arcstat{metric=...} equivalents from the raw kstat.
#
# --collector.processes and --collector.interrupts are off by default in
# node_exporter and the Host Full dashboard queries both (process states,
# PID/thread limits, per-IRQ rates): 12 panels sat on "No data" on onyx until
# 2026-09-05. The vmstat field set is the default plus pgscan/pgsteal — the
# Memory Pressure Story dashboard's reclaim panels read those four counters,
# and the default regex (oom_kill|pgpg|pswp|pg.*fault) never exported them.
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter --no-collector.zfs --collector.textfile.directory=/var/lib/node_exporter/textfile_collector --collector.processes --collector.interrupts --collector.vmstat.fields=^(oom_kill|pgpg|pswp|pg.*fault|pgscan|pgsteal).*
