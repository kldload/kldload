# journald storage policy. Read by systemd-journald at start and on SIGUSR2.
#
# Storage=auto, NOT persistent, and the difference is the whole point of this
# file. On a kldload install /var/log is its own ZFS dataset (rpool/var/log),
# mounted by zfs-mount.service — which runs long after journald, because
# journald is a sysinit-stage service that almost everything else orders after.
#
# With Storage=persistent, journald CREATES /var/log/journal itself the moment
# it starts. On a ZFS root that directory is created on the still-unmounted
# rpool/var, journald opens system.journal there, and zfs-mount then mounts
# rpool/var/log on top of it. journald keeps writing to the now-shadowed inode;
# journalctl reads the visible one, which never grows again. The result is a
# machine with NO system journal at all — no kernel ring, no PID 1, nothing —
# while systemd-journald sits there reporting "active (running), Processing
# requests...". It is silent, it survives reboots, and it makes every
# boot-time failure on the box undiagnosable.
#
# HISTORY .132 2026-08-26: two consecutive boots recorded zero system messages.
# system.journal's mtime was stuck at the previous day's shutdown while the
# user journal updated normally. `logger -p daemon.err` wrote a line that never
# came back from journalctl. Restarting journald — after the mount — fixed it
# instantly. journald had started at 13:42:23; zfs-mount finished at 13:42:27.
# Four seconds decided whether the machine kept a log. It was found only
# because it blocked the diagnosis of an unrelated failed unit.
#
# Storage=auto is what every distro ships and it is race-free by construction:
# journald buffers to /run/log/journal, and systemd-journal-flush.service —
# ordered After=local-fs.target, i.e. after the dataset is mounted — migrates
# it to /var/log/journal. Persistence still happens, because the directory
# exists on the dataset; it just happens at the point where it is safe.
# kldload-journal-flush.service creates it on first boot and verifies the
# outcome.
[Journal]
Storage=auto
# promtail ships journal entries to Loki, so the journal has to survive a
# reboot for a scrape to be complete.
SystemMaxUse=2G
SystemMaxFileSize=100M
