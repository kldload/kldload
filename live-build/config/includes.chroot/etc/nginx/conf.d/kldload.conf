# kldload reverse-proxy site — ONE :8443 TLS+HTTP/2 listener, N backends.
#
# Replaces the 1.0.5-era /usr/local/sbin/kldload-proxy (Python stdlib).
# Why the swap: HTTP/1.1 parallel connections made the self-signed cert
# trust-handshake flicker visible on every dashboard refresh, and a
# stdlib proxy can't support the drop-in pattern the new session/console
# machinery needs (graceful nginx -s reload, per-connection body buffering,
# real WS upgrade state, auth_request for future OIDC / mTLS hooks).
#
# Drop-in contract for dynamic routes:
#   /etc/nginx/conf.d/kldload-dyn/*.conf
#     — written by kldload-session open  (terminal/VM console/pod-exec)
#     — written by klab                   (VM graphical console via noVNC)
#     — written by future feature tools   (anything path-scoped to /s/<id>/)
#   After writing, the tool runs `nginx -t && nginx -s reload` — zero
#   dropped connections on existing sessions.

# ─── Upstreams ────────────────────────────────────────────────────────────
# One place to change ports. keepalive X reuses connections into backends,
# halves the latency hit on every click through the UI.
upstream kldload_webui    { server unix:/run/kldload/webui.sock; keepalive 16; }
upstream kldload_grafana  { server 127.0.0.1:3000; keepalive 16; }
upstream kldload_k9s      { server 127.0.0.1:7681; keepalive 16; }
upstream kldload_headlamp { server 127.0.0.1:4466; keepalive 16; }

# ─── Plain :80 — redirect to :8443 ─────────────────────────────────────────
# kldload doesn't serve plain HTTP. Redirect anything that hits :80 to the
# TLS+HTTP/2 endpoint. Preserves path so a bookmarked /grafana/ lands
# correctly after the redirect.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return      308 https://$host:8443$request_uri;
}

# ─── The real service on :8443 ─────────────────────────────────────────────
server {
    # HTTP/2 via the classic `http2` arg on listen (portable across
    # nginx 1.20+ — CentOS 9 stable is 1.20, Debian 13 is 1.26). The
    # newer `http2 on;` directive (1.25.1+) is NOT portable yet.
    listen                   8443 ssl http2 default_server;
    listen                   [::]:8443 ssl http2 default_server;
    server_name              _;

    # ── Access control (INTERIM — until the webui dispatch is authenticated) ──
    # The webui ws_handler dispatches wipe_disk / install / secret_set /
    # k8s_apply_yaml / zfs destroy+rollback with NO auth (the OIDC auth_request
    # hook below is the eventual fix). So the management surface must not be
    # reachable from arbitrary hosts. Default posture: LOCALHOST ONLY — the
    # local Chrome-app + the live installer both hit https://localhost:8443.
    # Extra allow rules for debug/remote testing are dropped into
    # kldload-access-*.conf by the build ONLY when KLDLOAD_DEBUG_ALLOW is set
    # (e.g. the onyx test box); a production image ships none, so the glob
    # matches nothing and everything non-local gets 403 at the edge. Replace
    # this whole block with the auth_request hook once auth lands.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/conf.d/kldload-access-*.conf;
    deny all;

    # Cert managed by kldload-tls-cert (delegates to kldload-ca when the
    # CA is initialized). When the cert rotates, kldload-bounce-tls-services
    # runs `systemctl reload nginx` so the new SAN set takes effect
    # without interrupting in-flight WS sessions.
    ssl_certificate          /var/lib/kldload/tls/webui.crt;
    ssl_certificate_key      /var/lib/kldload/tls/webui.key;

    # ── AUTH HOOK (disabled today; enterprise OIDC slot).
    # When oauth2-proxy / Dex / Authentik lands, uncomment these two lines
    # and point auth_request at the forward-auth endpoint. Every backend
    # below is automatically gated — no per-location change needed.
    # auth_request       /auth/verify;
    # auth_request_set   $auth_user $upstream_http_x_auth_user;

    # ── 1. CA root cert download.
    # Browsers and mobile devices fetch this once to silence the
    # "cert not trusted" warning for this install. kldload-ca trust-install
    # already adds it to the system store on the host itself.
    location = /kldload-ca.crt {
        alias               /etc/kldload/ca/root/ca.crt;
        default_type        application/x-x509-ca-cert;
        add_header          Content-Disposition 'attachment; filename="kldload-ca.crt"';
    }

    # ── 2. Headlamp — full-service Kubernetes GUI.
    # Pod exec + log tail both open WebSockets; buffering off so stdout
    # streams live. 24h read timeout covers a long `kubectl logs -f`
    # session left open on a second monitor.
    location /k8s/ {
        proxy_pass          http://kldload_headlamp/;
        include             /etc/nginx/kldload/proxy-common.conf;
        include             /etc/nginx/kldload/ws-upgrade.conf;
        proxy_buffering     off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # ── 3. Grafana at /grafana/ — keep the prefix (serve_from_sub_path=true).
    # Grafana Live opens ws at /grafana/api/live/ws.
    location /grafana/ {
        proxy_pass          http://kldload_grafana;
        include             /etc/nginx/kldload/proxy-common.conf;
        include             /etc/nginx/kldload/ws-upgrade.conf;
        proxy_buffering     off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # ── 4. ttyd-k9s at /k9s/ — ttyd is configured with `-b /k9s` so it
    # serves only at that prefix. Do NOT strip; ttyd 404s without it.
    location /k9s/ {
        proxy_pass          http://kldload_k9s;
        include             /etc/nginx/kldload/proxy-common.conf;
        include             /etc/nginx/kldload/ws-upgrade.conf;
        proxy_buffering     off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # ── 5. Dynamic session drop-ins (terminals, VM consoles, pod-exec,
    # noVNC, whatever else the webui spawns at runtime). Tools write
    # /etc/nginx/conf.d/kldload-dyn/<id>.conf with a single location
    # block scoped to /s/<id>/ and call `nginx -s reload`.
    include /etc/nginx/conf.d/kldload-dyn/*.conf;

    # ── 5c. Per-tool app windows — one Wayland app_id (hence one dock/window
    # icon) PER TOOL, via a distinct URL path per tool.
    #
    # WHY: kldload-chrome-app runs Chrome as a native Wayland client, and in
    # native Wayland Chrome derives a --app window's app_id from the URL
    # host+PATH (port/query/fragment stripped) and IGNORES --class. Every tool
    # view is the same hash-routed SPA, so launching them all at "/" collapsed
    # them to ONE app_id (chrome-localhost__-Default) and ONE icon. Launching
    # each at /app/<tool> makes Chrome emit "chrome-localhost__app_<tool>-Default"
    # — a distinct id GNOME matches to that tool's .desktop → its own icon.
    #
    # The SPA is unchanged and still lives at "/": its assets are absolute and
    # it routes on location.hash, so we rewrite /app/<anything> back to "/"
    # internally (the backend only serves the SPA at "/"). The browser URL — and
    # therefore the app_id — stays /app/<tool>; only the upstream request is "/".
    # Verified on .139 2026-06-15 (WAYLAND_DEBUG set_app_id + curl 200).
    location /app/ {
        rewrite             ^/app/.*$ / break;
        proxy_pass          http://kldload_webui;
        include             /etc/nginx/kldload/proxy-common.conf;
        include             /etc/nginx/kldload/ws-upgrade.conf;
    }

    # ── 6. kldload-webui — fall-through default route.
    location / {
        proxy_pass          http://kldload_webui;
        include             /etc/nginx/kldload/proxy-common.conf;
        include             /etc/nginx/kldload/ws-upgrade.conf;
    }
}
