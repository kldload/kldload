# kldload nginx main config — REPLACES the distro stock file.
#
# Why we ship our own: stock nginx.conf opens :80 with a "Welcome" page
# and drops us into the distro's default tuning. For a kldload appliance
# we want: no :80 surface, HTTP/2 + TLS ready at the http{} level, long
# idle timeouts that survive WebSocket streams (Grafana Live, ttyd
# terminals, Headlamp exec), and sane buffer sizes for the 4GB qcow2
# export flow. Putting all of that here keeps every conf.d/*.conf file
# focused on routing.
#
# conf.d/ is included at the bottom — real routing lives in
# /etc/nginx/conf.d/kldload.conf and /etc/nginx/conf.d/kldload-dyn/*.

user                 nginx;
worker_processes     auto;
worker_rlimit_nofile 65535;
error_log            /var/log/nginx/error.log warn;
pid                  /run/nginx.pid;

# Distro-loaded modules (brotli, geoip, headers-more, etc.) if present.
# Both Debian and RPM use this path. Missing-module entries are harmless
# — nginx-light on Debian skips this include cleanly.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;
    use                epoll;
    multi_accept       on;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Access log with upstream diagnostics — we correlate proxy-side
    # errors with upstream response times during field triage.
    log_format kldload
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'up=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log kldload;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;  # do not leak nginx version in headers/error pages

    # Body + buffer limits — the webui export flow pushes qcow2 uploads
    # to SCP targets via our API; 4G covers a golden-image max.
    client_max_body_size       4G;
    client_body_buffer_size    256k;
    proxy_buffer_size          16k;
    proxy_buffers              32 16k;
    proxy_busy_buffers_size    64k;

    # TLS baseline — kldload-tls-cert (optionally backed by kldload-ca)
    # writes the cert every service reads.
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;
    ssl_ciphers                HIGH:!aNULL:!MD5:!eNULL:!3DES:!DES:!RC4;
    ssl_session_cache          shared:SSL:16m;
    ssl_session_timeout        10m;

    # WebSocket upgrade map. The $connection_upgrade var becomes
    # "upgrade" iff the client's Upgrade header was set, else "close".
    # Every ws-upgrade.conf include uses this variable.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Routing lives here — one server per conf file, drop-ins from
    # kldload-dyn/ included from kldload.conf for dynamic sessions.
    include /etc/nginx/conf.d/*.conf;
}
