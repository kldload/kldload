# Common proxy headers for every upstream kldload fronts.
# Sourced via `include` from every location block. Centralizing the
# forwarded-* set here means any future auth layer (OIDC, oauth2-proxy)
# gets consistent identity attribution without editing N blocks.

proxy_http_version  1.1;
proxy_set_header    Host               $host;
proxy_set_header    X-Real-IP          $remote_addr;
# The client's source port: for a loopback client the backend maps it through
# /proc/net/tcp to the uid that owns the socket, which is the peer credential
# a TCP proxy cannot otherwise carry (2026-09-24).
proxy_set_header    X-Real-Port        $remote_port;
proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto  https;
proxy_set_header    X-Forwarded-Host   $host:8443;
proxy_set_header    X-Forwarded-Port   8443;
