# Common proxy headers for every upstream kldload fronts.
# Sourced via `include` from every location block. Centralizing the
# forwarded-* set here means any future auth layer (OIDC, oauth2-proxy)
# gets consistent identity attribution without editing N blocks.

proxy_http_version  1.1;
proxy_set_header    Host               $host;
proxy_set_header    X-Real-IP          $remote_addr;
proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto  https;
proxy_set_header    X-Forwarded-Host   $host:8443;
proxy_set_header    X-Forwarded-Port   8443;
