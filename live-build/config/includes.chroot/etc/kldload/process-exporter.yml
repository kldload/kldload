# kldload process-exporter config — name every process by its comm (binary
# basename) so the Grafana panels can group by name pattern. The cmdline:
# regex matches every process so nothing is dropped.
#
# Refine over time if cardinality becomes a problem (some 1000+ processes
# of the same name = big counter set). Today we want max visibility.
process_names:
  - name: "{{.Comm}}"
    cmdline:
      - .+
