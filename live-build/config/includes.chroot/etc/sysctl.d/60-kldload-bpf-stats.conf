# kldload — kernel.bpf_stats_enabled: account run time and run count per
# BPF program (bpftool prog show / the eBPF Deep Dive and Live Matrix
# dashboards read them). Off by default in the kernel; without it the
# "BPF CPU" and "hottest BPF programs" panels have nothing to show (onyx,
# 2026-09-05). Cost: a couple of nanoseconds per program run.
kernel.bpf_stats_enabled = 1
