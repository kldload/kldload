server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        host: kldload-node
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
      - source_labels: [__journal__transport]
        target_label: transport
      - source_labels: [__journal_priority_keyword]
        target_label: severity
      - source_labels: [__journal_syslog_identifier]
        target_label: syslog_id

  - job_name: zfs-dbgmsg
    static_configs:
      - targets: [localhost]
        labels:
          job: zfs-dbgmsg
          host: kldload-node
          # kldload-zfs-dbgmsg.timer drains /proc/spl/kstat/zfs/dbgmsg
          # into a 0644 tailable log every 10s — see
          # /usr/local/bin/kldload-zfs-dbgmsg-collector. The kstat node is
          # 0600 root:root and is a kstat dump (not append-only) so promtail
          # cannot scrape it directly.
          __path__: /var/log/kldload/zfs-dbgmsg.log

  - job_name: kldload-apps
    static_configs:
      - targets: [localhost]
        labels:
          job: kldload-apps
          host: kldload-node
          __path__: /var/log/kldload/*.log

  - job_name: kldload-installer
    static_configs:
      - targets: [localhost]
        labels:
          job: kldload-installer
          host: kldload-node
          __path__: /var/log/installer/*.log

  # ── ZFS test-suite output (pre-digested, 1 file per distro) ────────
  # The runner writes <run-id>/<distro>.log during test runs. Tail all of
  # them with the vm label extracted from the filename so the test-bench
  # dashboards can correlate on {vm=<distro>}.
  #
  # BOTH paths on purpose. The lab was renamed klab -> kzfs-test and now
  # writes /root/kzfs-test/<run-id>/<distro>.log; this scrape still pointed
  # only at /root/klab, so the "klab test output — every distro, every test,
  # live" panel went to "No data" the day the tool was renamed and stayed
  # there, with the run producing logs the whole time. Keeping the old path
  # costs nothing and keeps historical runs visible (fiend, 2026-08-16).
  - job_name: klab-test-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: klab-test-logs
          host: kldload-node
          __path__: /root/kzfs-test/*/*.log
      - targets: [localhost]
        labels:
          job: klab-test-logs
          host: kldload-node
          __path__: /root/klab/*/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '/root/(?:klab|kzfs-test)/[^/]+/(?P<vm>[a-z]+)\.log'
      - labels:
          vm:

  # ── klab VM serial consoles ────────────────────────────────────────
  # libvirt writes every VM's serial output (including the guest kernel
  # ring) to /var/log/klab/klab-(ztest|test)-<distro>-console.log. The
  # Test Debug dashboard's hung_task / kernel-BUG / dmsg panels query
  # {vm=<distro>} |~ "hung_task|...", so without this scrape they hit
  # the right label dimension but never match any line. Tailing the
  # consoles into Loki with vm + variant labels closes that gap.
  - job_name: klab-vm-console
    static_configs:
      - targets: [localhost]
        labels:
          job: klab-vm-console
          host: kldload-node
          source: serial-console
          __path__: /var/log/klab/klab-*-console.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '/var/log/klab/klab-(?P<variant>ztest|test|blue|green)-(?P<vm>[a-z]+)-console\.log'
      - labels:
          vm:
          variant:
