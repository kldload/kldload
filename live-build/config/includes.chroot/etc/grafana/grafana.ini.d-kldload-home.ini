# Override Grafana's default landing page from the stock "Welcome to
# Grafana" home (which loads a generic getting-started page nobody wants)
# to the kldload Home dashboard. Survives Grafana restarts because it's
# in /etc/grafana/, loaded by the systemd unit's --config flag chain.
[users]
default_home_dashboard_uid = kldload-home
home_page = /grafana/d/kldload-home
