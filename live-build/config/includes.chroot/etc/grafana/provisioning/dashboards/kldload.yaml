  # ── Observability section ─────────────────────────────────────────────
  # Split from Kubernetes when the eBPF dashboards grew past 5 and the
  # planned Brendan-Gregg-style heatmaps + Loki forensics + Pyroscope
  # flame graphs would have swamped a single folder. Prefix-grouped
  # because Grafana folders don't nest — the alphabetical sort produces a
  # clean visual cluster in the left nav (Observability — Pitch /
  # Performance / Network / Forensics).
  - name: kldload-observability-pitch
    orgId: 1
    folder: Observability — Pitch
