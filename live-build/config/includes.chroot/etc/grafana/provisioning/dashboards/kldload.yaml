    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/zfs-test-lab
      foldersFromFilesStructure: false

  - name: kldload-kubernetes
    orgId: 1
    folder: Kubernetes
    folderUid: kldload-kubernetes
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/kubernetes
      foldersFromFilesStructure: false
