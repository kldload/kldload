# kldload Grafana dashboard provisioning — one provider per folder so the
# left-nav groups dashboards by purpose (Host / Storage / Per-VM / klab
# Operations / ZFS Test Lab / Kubernetes). Each provider scans its own
# subdirectory under /var/lib/grafana/dashboards/.
#
# Adding a new dashboard: drop the JSON file in the right subfolder. The
# updateIntervalSeconds setting picks up new files within 30s without a
# Grafana restart.
#
# Renaming a dashboard's CATEGORY: move the JSON file between subfolders
# and Grafana re-provisions to the new folder on next sweep.

apiVersion: 1
providers:
  - name: kldload-home
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/home
      foldersFromFilesStructure: false

  - name: kldload-host
    orgId: 1
    folder: Host
    folderUid: kldload-host
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/host
      foldersFromFilesStructure: false

  - name: kldload-storage
    orgId: 1
    folder: Storage
    folderUid: kldload-storage
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/storage
      foldersFromFilesStructure: false

  - name: kldload-per-vm
    orgId: 1
    folder: Per-VM Reporting
    folderUid: kldload-per-vm
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
