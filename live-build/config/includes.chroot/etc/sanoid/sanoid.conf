# kldload sanoid.conf
# Scheduled snapshots for all persistent datasets.
# APT pre/post snapshots are handled separately by APT hooks.

[rpool/ROOT]
use_template = bootenv
recursive = yes

[rpool/home]
use_template = data
recursive = yes

[rpool/var/lib]
use_template = data
recursive = yes

# Container storage is NOT data. podman's zfs driver makes every image layer a
# dataset of its own, and the recursion above snapshotted every one of them
# under the full data ladder: 3,531 of onyx's 5,496 snapshots were image
# layers (2026-09-28). A pull rebuilds a layer. A child section overrides the
# parent's recursion -- checked with sanoid on a scratch tree the same day.
# sanoid never prunes a period whose count is 0, so this stops new layer
# snapshots and leaves any that exist for a one-off `zfs destroy`.
[rpool/var/lib/containers]
use_template = none
recursive = yes

[rpool/srv]
use_template = data
recursive = yes

[rpool/root]
use_template = data
recursive = no

# Nothing taken, nothing pruned: for trees that are rebuilt, not restored.
[template_none]
frequently = 0
hourly     = 0
daily      = 0
weekly     = 0
monthly    = 0
yearly     = 0
autosnap   = no
autoprune  = no

# Boot environments — daily + weekly, no hourly churn on /
[template_bootenv]
frequently = 0
hourly     = 0
daily      = 7
weekly     = 12
monthly    = 12
yearly     = 0
autosnap   = yes
autoprune  = yes

# Data datasets — full retention ladder:
#   daily=7    → 1 week of dailies
#   weekly=12  → 12 weeks (covers 2-week, 3-week marks)
#   monthly=12 → 12 months (covers 3-month, 6-month, 12-month marks)
#   yearly=1   → 1 year anchor
[template_data]
frequently = 0
hourly     = 0
daily      = 7
weekly     = 12
monthly    = 12
yearly     = 1
autosnap   = yes
autoprune  = yes
