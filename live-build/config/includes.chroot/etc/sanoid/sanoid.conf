# /etc/sanoid/sanoid.conf on the LIVE ISO — the fallback copy.
# Generated by `kldload-snapshot-policy conf --pool rpool` with every class
# listed; an install writes the target's own from the same table, naming only
# the datasets that exist. Regenerate this file from the tool, never by hand.
# Read by sanoid.timer (every 15 min).

[rpool/ROOT]
	use_template = bootenv
	recursive = yes

[rpool/home]
	use_template = data
	recursive = yes

[rpool/srv]
	use_template = data
	recursive = yes

[rpool/root]
	use_template = data
	recursive = no

[rpool/opt]
	use_template = data
	recursive = no

[rpool/usr/local]
	use_template = data
	recursive = no

[rpool/kldload]
	use_template = data
	recursive = yes

[rpool/var/spool]
	use_template = data
	recursive = no

[rpool/var/lib]
	use_template = data
	recursive = yes

[rpool/var/log]
	use_template = short
	recursive = no

[rpool/var/lib/etcd]
	use_template = short
	recursive = no

[rpool/var/lib/containers]
	use_template = none
	recursive = yes

[rpool/var/lib/docker]
	use_template = none
	recursive = yes

[rpool/var/lib/containerd]
	use_template = none
	recursive = yes

[rpool/var/lib/kubelet]
	use_template = none
	recursive = yes

[rpool/var/lib/libvirt/images]
	use_template = none
	recursive = no

[rpool/var/lib/kldload-netboot]
	use_template = none
	recursive = yes

[rpool/var/cache]
	use_template = none
	recursive = yes

[rpool/var/tmp]
	use_template = none
	recursive = yes

[rpool/tmp]
	use_template = none
	recursive = yes

[rpool/vms]
	use_template = vms
	recursive = yes

[template_bootenv]
	frequently = 0
	hourly = 12
	daily = 7
	weekly = 2
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_data]
	frequently = 0
	hourly = 0
	daily = 7
	weekly = 4
	monthly = 1
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_short]
	frequently = 0
	hourly = 0
	daily = 3
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_vms]
	frequently = 0
	hourly = 12
	daily = 3
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_none]
	frequently = 0
	hourly = 0
	daily = 0
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = no
	autoprune = no
