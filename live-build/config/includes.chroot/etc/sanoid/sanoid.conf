# kldload sanoid.conf
# Scheduled snapshots for all persistent datasets.
# APT pre/post snapshots are handled separately by APT hooks.

[rpool/ROOT]
use_template = bootenv
recursive = yes

[rpool/home]
use_template = data
recursive = yes

[rpool/var/lib]
use_template = data
recursive = yes

[rpool/srv]
use_template = data
recursive = yes

[rpool/root]
use_template = data
recursive = no

# Boot environments — kept deliberately LEAN. Every snapshot of rpool/ROOT/<be>
# is listed by ZFSBootMenu as a rollback target, so deep retention here turns the
# boot picker into a wall of near-identical entries you can't choose from at 3am.
# 7 daily + 4 weekly + 3 monthly = ~14 dated rollback points is plenty; fine-
# grained recent points come from the bounded @auto-* hourly stream (kldload-
# snapshot, pruned to 24) and the @{apt,dnf,pacman}-pre-* pre-transaction marks.
# No hourly churn on / here — that is the auto-* stream's job. # HISTORY: 1.3.1
[template_bootenv]
frequently = 0
hourly     = 0
daily      = 7
weekly     = 4
monthly    = 3
yearly     = 0
autosnap   = yes
autoprune  = yes

# Data datasets — full retention ladder:
#   daily=7    → 1 week of dailies
#   weekly=12  → 12 weeks (covers 2-week, 3-week marks)
#   monthly=12 → 12 months (covers 3-month, 6-month, 12-month marks)
#   yearly=1   → 1 year anchor
[template_data]
frequently = 0
hourly     = 0
daily      = 7
weekly     = 12
monthly    = 12
yearly     = 1
autosnap   = yes
autoprune  = yes
