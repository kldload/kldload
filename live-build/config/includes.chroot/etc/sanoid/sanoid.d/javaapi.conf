# sanoid policy — kldload 1.0 PetClinic demo dataset
#
# Snapshots the Postgres PVC dataset on an aggressive 5-min cadence so
# `kube-demo javaapi_recover` always has a fresh point-in-time to
# roll back to. Sanoid runs from /etc/cron.d/sanoid every minute and
# applies these rules.
#
# Template tuning rationale:
#   * frequently = 12          → 12 snapshots × 5 min = 1 hour of fine-grained
#                                rollback. The demo "drop a table" → "recover"
#                                always finds a clean snap within the last 5 min.
#   * hourly = 48              → 48 hours of hourly snaps for "rollback yesterday"
#   * daily = 30               → 30 days for "rollback last week"
#   * monthly = 0, yearly = 0  → demo dataset isn't a long-term archive
#
# Pool footprint at steady state: ~90 snapshots × ZFS-COW delta. On the
# Postgres test workload (~5 GB live, ~50 MB/hr churn), expect total
# snapshot cost of ~1.5 GB after 48 hours. Negligible.
#
# Sanoid_period in /etc/cron.d/sanoid runs every minute; `frequently:
# 12 frequent_period 5min` (template defaults) trigger snapshot creation
# every 5 minutes.

[template_javaapi]
        frequently = 12
        frequent_period = 5
        hourly = 48
        daily = 30
        monthly = 0
        yearly = 0
        autosnap = yes
        autoprune = yes

# The dataset name comes from the ZFS-CSI storage class — when k8s
# creates a PVC named "pvc-postgres-data" in namespace "demo", the
# default kldload storage class maps it to:
#   rpool/k8s/<pvc-name>
# (the namespace is in the kustomized label, not the dataset path).
#
# If the demo namespace or PVC name changes, edit the path below to
# match.

[rpool/k8s/pvc-postgres-data]
        use_template = javaapi
        recursive = no
