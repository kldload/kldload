# k9s launch config — kldload defaults. WHY: stock k9s opens with the ASCII
# pirate logo and its yellow-on-black theme, which clashes with the console
# family (zxplore/wgxplore). This selects the family skin and drops the logo.
# k9s rewrites this file with its full default tree on first run — that is
# expected and harmless; ui.skin/ui.logoless survive the merge.
k9s:
  ui:
    skin: kldload
    logoless: true
