# kldload family skin for k9s — the console-family palette (slate chassis,
# teal focus, amber accent, health greens/ambers/reds) so k9s reads as a
# sibling of zxplore/wgxplore instead of stock yellow-on-black.
# Read by: ~/.config/k9s/config.yaml (ui.skin: kldload). Missing file =
# k9s silently falls back to its default look — dorky but harmless.
# Palette source of truth: wgxplore gui.go (pal* constants).
k9s:
  body:
    fgColor: "#dce6ee"
    bgColor: "#10161d"
    logoColor: "#49c7c0"
  prompt:
    fgColor: "#dce6ee"
    bgColor: "#10161d"
    suggestColor: "#7d8d9b"
  info:
    fgColor: "#7d8d9b"
    sectionColor: "#dce6ee"
  dialog:
    fgColor: "#dce6ee"
    bgColor: "#171f28"
    buttonFgColor: "#10161d"
    buttonBgColor: "#49c7c0"
    buttonFocusFgColor: "#10161d"
    buttonFocusBgColor: "#f0c674"
    labelFgColor: "#f0c674"
    fieldFgColor: "#dce6ee"
  frame:
    border:
      fgColor: "#24303b"
      focusColor: "#49c7c0"
    menu:
      fgColor: "#dce6ee"
      keyColor: "#49c7c0"
      numKeyColor: "#f0c674"
    crumbs:
      fgColor: "#10161d"
      bgColor: "#1d2731"
      activeColor: "#49c7c0"
    status:
      newColor: "#49c7c0"
      modifyColor: "#f0c674"
      addColor: "#4cb98a"
      errorColor: "#dc4848"
      highlightColor: "#f0c674"
      killColor: "#ff5cd6"
      completedColor: "#7d8d9b"
    title:
      fgColor: "#dce6ee"
      bgColor: "#10161d"
      highlightColor: "#49c7c0"
      counterColor: "#f0c674"
      filterColor: "#49c7c0"
  views:
    charts:
      bgColor: "#10161d"
      defaultDialColors:
        - "#49c7c0"
        - "#dc4848"
      defaultChartColors:
        - "#49c7c0"
        - "#dc4848"
    table:
      fgColor: "#dce6ee"
      bgColor: "#10161d"
      cursorFgColor: "#10161d"
      cursorBgColor: "#49c7c0"
      markColor: "#f0c674"
      header:
        fgColor: "#7d8d9b"
        bgColor: "#10161d"
        sorterColor: "#49c7c0"
    xray:
      fgColor: "#dce6ee"
      bgColor: "#10161d"
      cursorColor: "#49c7c0"
      graphicColor: "#f0c674"
      showIcons: false
    yaml:
      keyColor: "#49c7c0"
      colonColor: "#7d8d9b"
      valueColor: "#dce6ee"
    logs:
      fgColor: "#dce6ee"
      bgColor: "#10161d"
      indicator:
        fgColor: "#10161d"
        bgColor: "#49c7c0"
        toggleOnColor: "#4cb98a"
        toggleOffColor: "#7d8d9b"
