# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  kldloadOS tmux                                                         ║
# ║  Prefix: Ctrl-a  |  ? = help  |  r = reload                            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# ── Prefix: Ctrl-a (screen muscle memory) ──────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Basics ─────────────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g set-clipboard on

# ── Splits — | and - (intuitive) ──────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation — Alt+Arrow (no prefix needed) ────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Pane navigation — hjkl (with prefix) ──────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize — Shift+Arrow (no prefix) ─────────────────────────────────
bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up    resize-pane -U 1
bind -n S-Down  resize-pane -D 1

# ── Window switching — Alt+number (no prefix) ─────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Window cycling — Alt+h/l (no prefix) ──────────────────────────────────
bind -n M-h previous-window
bind -n M-l next-window

# ── Swap panes ─────────────────────────────────────────────────────────────
bind > swap-pane -D
bind < swap-pane -U

# ── Zoom (toggle fullscreen pane) ─────────────────────────────────────────
bind z resize-pane -Z
bind f resize-pane -Z

# ── Kill pane/window with confirm ─────────────────────────────────────────
bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind X confirm-before -p "kill window? (y/n)" kill-window

# ── Reload config ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message " Config reloaded"

# ── Vi copy mode ──────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# ── Quick access: kldload tools (prefix + key) ────────────────────────────
bind S new-window -n "health" "kst; echo ''; echo 'Press Enter to close.'; read"
bind D new-window -n "dashboard" "kst-dashboard --attach"
bind H new-window -n "help" "kldload-help | less -R"

# ── Theme — kldload color schema ──────────────────────────────────────────
# --bg #0f1117  --surface #161b25  --accent #34d399  --accent2 #60a5fa
# --muted #64748b  --text #e2e8f0

set -g status-position bottom
set -g status-style                 "bg=#161b25 fg=#e2e8f0"
set -g status-left-length           50
set -g status-right-length          80

set -g status-left  "#[fg=#0f1117,bg=#34d399,bold]  kldload #[fg=#34d399,bg=#1e2533] #S #[fg=#1e2533,bg=#161b25] "
set -g status-right "#[fg=#64748b] #[fg=#60a5fa]C-a ? #[fg=#64748b]help  #[fg=#64748b]%H:%M  #[fg=#34d399,bold]#H "

set -g window-status-format         "#[fg=#64748b] #I #W "
set -g window-status-current-format "#[fg=#0f1117,bg=#34d399,bold] #I #W #[fg=#34d399,bg=#161b25]"
set -g window-status-separator      ""

set -g pane-border-style            "fg=#1e2533"
set -g pane-active-border-style     "fg=#34d399"
set -g pane-border-lines            heavy

set -g message-style                "bg=#1e2533 fg=#34d399"
set -g message-command-style        "bg=#1e2533 fg=#60a5fa"

set -g mode-style                   "bg=#34d399 fg=#0f1117"

# ── Clock ─────────────────────────────────────────────────────────────────
setw -g clock-mode-colour "#34d399"
setw -g clock-mode-style 24
