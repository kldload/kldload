# kldloadOS tmux config
#
# Prefix: Ctrl-a
#
# Keybindings:
#   C-a |         split horizontal
#   C-a -         split vertical
#   C-a c         new window (opens in current directory)
#   Alt+←→↑↓     move between panes (no prefix needed)
#   Shift+←→↑↓   resize panes (no prefix needed)
#   Alt+1-9       switch windows (no prefix needed)
#   Alt+h/l       prev/next window (no prefix needed)
#   C-a z         zoom pane (toggle fullscreen)
#   C-a x         kill pane
#   C-a d         detach session
#   C-a r         reload config
#   C-a [         enter copy mode (vi keys, v=select, y=yank)

# ── Prefix: Ctrl-a ────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Basics ─────────────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Splits ─────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation — Alt+Arrow (no prefix needed) ────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Pane resize — Shift+Arrow (no prefix needed) ──────────────────────────
bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up    resize-pane -U 1
bind -n S-Down  resize-pane -D 1

# ── Window switching — Alt+number (no prefix needed) ──────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Window cycling — Alt+h/l (no prefix needed) ──────────────────────────
bind -n M-h previous-window
bind -n M-l next-window

# ── Zoom ──────────────────────────────────────────────────────────────────
bind z resize-pane -Z

# ── Reload config ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# ── Vi copy mode ──────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Theme — matches kldload website color schema ─────────────────────────
# --bg #0f1117  --surface #161b25  --accent #34d399  --accent2 #60a5fa
# --muted #64748b  --text #e2e8f0

set -g status-style                 "bg=#161b25 fg=#e2e8f0"
set -g status-left-length           40
set -g status-right-length          60

set -g status-left  "#[fg=#94a3b8,bold] kld#[fg=#00b8d9]load #[fg=#64748b]> "
set -g status-right "#[fg=#64748b]%H:%M  #[fg=#34d399,bold]#H"

set -g window-status-format         "#[fg=#64748b] #I:#W "
set -g window-status-current-format "#[fg=#34d399,bold] #I:#W "
set -g window-status-separator      ""

set -g pane-border-style            "fg=#1e2533"
set -g pane-active-border-style     "fg=#34d399"

set -g message-style                "bg=#1e2533 fg=#34d399"
set -g message-command-style        "bg=#1e2533 fg=#60a5fa"

set -g mode-style                   "bg=#34d399 fg=#0f1117"
