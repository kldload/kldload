# Load WireGuard kernel module at boot. Required for:
#   - kube-cluster bootstrap (wg-mgmt + wg-k8s dual-plane mesh)
#   - klab site-to-site (wg0 backplane between blue/green VMs)
#   - Any ansible playbook that calls kube-network init/add-peer
# The wireguard-tools userspace package is installed separately.
wireguard
