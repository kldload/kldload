# Post-quantum KEX — advertise ML-KEM + sntrup761 hybrids.
#
# Why this file exists: Red Hat's system crypto-policy DEFAULT on EL9
# excludes mlkem768x25519-sha256 and sntrup761x25519-sha512@openssh.com
# from the KEX list, even though the shipped OpenSSH 9.9p1+ supports
# them. Without this drop-in, the server only offers classical
# curve25519 / ecdh / DH, and modern clients (OpenSSH 9.9+, Ghostty's
# embedded client) print a "store now, decrypt later" advisory on
# connect.
#
# The '+' prefix appends to whatever the crypto-policy has already set
# — we add PQ on top, we don't override anything classical.
#
# Per-distro status:
#   CentOS 9 Stream (9.9p1)  — both algos supported, advertised here.
#   Fedora 43       (10.0p1) — both algos supported.
#   Debian 13       (10.0p1) — both algos supported.
#   Alpine          (10.2p1) — both algos supported.
#   Ubuntu 24.04    (9.6p1)  — pre-ML-KEM; sntrup761 works, mlkem silently drops.
KexAlgorithms +mlkem768x25519-sha256,sntrup761x25519-sha512@openssh.com
