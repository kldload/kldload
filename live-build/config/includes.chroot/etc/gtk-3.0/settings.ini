[Settings]
# kldload: force dark theme system-wide for GTK3 apps.
# Libadwaita apps read org.gnome.desktop.interface.color-scheme (dconf),
# but GTK3 apps (Konsole's GTK3 deps, Nautilus on stock GNOME, dialog
# pickers, older gtk3-only tools like Filezilla/Audacity) only read
# this file. Without it the dark canvas of the dconf override left
# random GTK3 windows rendering against a white background — looked
# inconsistent against the rest of the desktop (.135 2026-06-05).
gtk-application-prefer-dark-theme=true
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
