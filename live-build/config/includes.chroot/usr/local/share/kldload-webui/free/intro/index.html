<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kldload intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  kldload intro -- a demoscene tribute, real time, one file, no assets.

  WHAT IT IS: one continuous raymarched shot over a slow plasma. A liquid form
  calms into a torus, the torus squares off into a solid cube, and the cube
  carves itself into a Menger sponge one level at a time, holds on the close,
  and fades to black.
  Every surface, light and backdrop is computed by the shader; nothing is
  fetched.

  WHY IT LOOKS LIKE THIS: the first cut had four loud retro scenes (copper bars
  and a title, the shapes, a tunnel with greetings, credits). The operator kept
  the cube, the morph and the credits' plasma, and asked for them much slower,
  filling the whole clip, ending on the complete cube -- "elegant and tasteful
  and classy ... clean, smooth ... pro" (onyx, 2026-09-18). So: muted palette,
  no scanlines, restrained bloom, and supersampled edges for the video. The
  other scenes are in git history.

  TWO WAYS TO RUN IT:
    live      open it: requestAnimationFrame drives the clock.
    ?t=SECS   render exactly one frame at that WALL-CLOCK time, then set
              window.__ready = true: stills for review, and frame-by-frame
              stepping for the video render (rendered, never screen-captured).
    ?aa=N     N x N samples per pixel (default 1 live, 2 with ?t=). The video
              uses 2 or 3: raymarched edges crawl without it.
    ?res=0.5  render scale (live only): a kiosk may be software-rendered.
    ?nopost   debug: the shot without the post pass.

  THE TIMELINE is STAGES below (piece-seconds); RUNTIME is the whole clip.
-->
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ─── The timeline, in piece-seconds ─────────────────────────────────────────
// Every time below is in piece-seconds; pieceTime() converts wall-clock to them,
// so the whole piece -- morphs, tumble, plasma, captions, fades -- plays faster or
// slower as one. The first cut ran at 1; the operator asked for double, then
// "still to slow", then "the whole thing in 30s" (2026-09-18) -- so the knob is
// now the RUNTIME, and the rates follow from it. Each STAGES boundary is a
// uniform, so retiming -- or syncing to the soundtrack -- is a change here and
// nothing in the shader.
const RUNTIME = 30;            // wall-clock seconds, fade to black included
const CLOSE_HOLD = 12;         // the close runs from 18 s to the end
const FADE_END = 5;            // a long fade to black (operator: "another 2-3 seconds of fade out")
// KEYFRAMES, wall -> piece (operator, 2026-09-18: "the blob and the ring should
// be over in 6 seconds .. then the kube takes until 18s and then 7sec end, 25s";
// then "another 2-3 seconds of fade out", then "go the full 30 sec": the close
// holds from 18 s, the 5 s fade to black starts at 25 s).
// Piece times are the STAGES below: 62 = the torus starts squaring off, 118 =
// the sponge is complete, 124 = where it coasts to under the date.
const KEYS = [[0, 0], [6, 62], [18, 118], [30, 125.5]];
// Monotone cubic (Fritsch-Carlson) through KEYS: speed is continuous across
// every keyframe, it never runs backwards, and the last tangent is 0 so the
// sponge eases to a standstill on the final frame.
function pieceTime(wall) {
  const n = KEYS.length, w = Math.min(KEYS[n - 1][0], Math.max(0, wall));
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][1] - KEYS[i][1]) / (KEYS[i + 1][0] - KEYS[i][0]));
  m.push(d[0]);
  for (let i = 1; i < n - 1; i++) {
    // weighted harmonic mean of the neighbouring slopes, weights from the
    // interval widths (Fritsch-Carlson / Fritsch-Butland for uneven spacing)
    const h0 = KEYS[i][0] - KEYS[i - 1][0], h1 = KEYS[i + 1][0] - KEYS[i][0];
    const w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
    m.push(d[i - 1] * d[i] <= 0 ? 0 : (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]));
  }
  m.push(0);
  let i = 0; while (i < n - 2 && w > KEYS[i + 1][0]) i++;
  const [x0, y0] = KEYS[i], [x1, y1] = KEYS[i + 1], h = x1 - x0, u = (w - x0) / h;
  const h00 = 2*u*u*u - 3*u*u + 1, h10 = u*u*u - 2*u*u + u, h01 = -2*u*u*u + 3*u*u, h11 = u*u*u - u*u;
  return h00 * y0 + h10 * h * m[i] + h01 * y1 + h11 * h * m[i + 1];
}
const STAGES = {
  formToTorus: [26, 50],   // the liquid form holds, then becomes a torus
  torusToCube: [62, 80],   // the torus squares off into a solid cube
  carve1:      [86, 96],   // the cube's largest openings
  carve2:      [95, 106],  // the next level down
  carve3:      [105, 118], // the finest: the complete sponge, just before the close
};

// ─── The tribute ────────────────────────────────────────────────────────────
// Parties, one at a time, over the shot: name and founding year as listed by
// Wikipedia's "Demoparty" article (read 2026-09-18). No logos, no end years.
const PARTIES = [
  ["THE PARTY", 1991], ["ASSEMBLY", 1992], ["THE GATHERING", 1992],
  ["MEKKA & SYMPOSIUM", 1996], ["EVOKE", 1997], ["SILLY VENTURE", 2000],
  ["SOLSKOGEN", 2002], ["BREAKPOINT", 2003], ["FUNCTION", 2003],
  ["OUTLINE", 2004], ["REVISION", 2011], ["NORDLICHT", 2012],
  ["DEADLINE", 2014], ["LOVEBYTE", 2021],
];
// All of them, a row at a time, one row per transformation (operator,
// 2026-09-18: "all of the names and years .. 4-5 at a time", then "condense
// that into 4-5 and then show those during transformation"). ROWS rows split as
// evenly as they go (14 -> 4, 4, 3, 3), each held the same WALL-clock time
// across everything before the close, so none is rushed by the fast opening:
// blob to ring, ring to cube, the cube opening, the sponge completing.
const TRIBUTE = { start: 0.6, fade: 0.8, rows: 4 };

// The close, over the finished sponge: the year, and the next party. Deadline
// 2026, 2-4 October, ORWOhaus Berlin (demoparty.berlin, read 2026-09-18). The
// operator's call: not "a tribute", not the heritage list -- the scene and the
// date (2026-09-18).
const CLOSE = { title: "DEMOSCENE 2026",
  sub: "DEADLINE  \u00B7  2\u20134 OCTOBER  \u00B7  BERLIN" };

// ─── GL plumbing ────────────────────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const FIXED_T = Q.has("t") ? parseFloat(Q.get("t")) : null;
// ?render&fps=N: step every frame at exactly i/N seconds and POST each one to the
// page's own origin (/frame?i=), which is tools/intro/render.py -- the video is
// rendered frame by frame, so it is identical however slowly a frame draws.
const RENDER = Q.has("render"), FPS = parseFloat(Q.get("fps") || "60");
const NOPOST = Q.has("nopost");
const RES = Math.min(1, Math.max(0.25, parseFloat(Q.get("res") || "1")));
const AA = Math.min(4, Math.max(1, parseInt(Q.get("aa") || (STILL ? "2" : "1"), 10)));
const cv = document.getElementById("c");
const STILL = FIXED_T !== null || RENDER;   // one exact frame at a time, at 1:1 pixels
const gl = cv.getContext("webgl2", { antialias: false, preserveDrawingBuffer: STILL });
if (!gl) { document.body.textContent = "WebGL2 is not available"; throw new Error("no webgl2"); }

const VS = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p*.5+.5; gl_Position = vec4(p,0,1); }`;

function compile(src, type) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + "\n" + src.split("\n").map((l, i) => (i + 1) + ": " + l).join("\n"));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

let fbo = null, fboTex = null, fw = 0, fh = 0;
function resize() {
  const dpr = STILL ? 1 : Math.min(2, window.devicePixelRatio || 1);
  // innerWidth, not clientWidth: a frame drawn before layout read 0 and rendered
  // the whole shot into a 2x2 buffer stretched to the screen (stills, 2026-09-18).
  // A render names its exact frame size (?w=&h=): headless Chrome's viewport is
  // the window minus about 121 px of browser UI, so --window-size=640,360 drew
  // 640x239 frames that ffmpeg then refused (odd height, 2026-09-18).
  const w = RENDER && Q.has("w") ? parseInt(Q.get("w"), 10) : Math.max(2, Math.floor(innerWidth * dpr * RES));
  const h = RENDER && Q.has("h") ? parseInt(Q.get("h"), 10) : Math.max(2, Math.floor(innerHeight * dpr * RES));
  if (w === fw && h === fh) return;
  cv.width = w; cv.height = h; fw = w; fh = h;
  if (fbo) { gl.deleteFramebuffer(fbo); gl.deleteTexture(fboTex); }
  fboTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
}

// ─── Type ───────────────────────────────────────────────────────────────────
// A card is drawn once with Canvas2D (wide-tracked light sans) into a texture
// the size of the screen, and faded in the post pass. Cached per card.
const cardCache = new Map();
const tcv = document.createElement("canvas"), tctx = tcv.getContext("2d");
function track(ctx, str, x, y, spacing) {    // letter-spaced text, centred on x
  let w = 0; for (const ch of str) w += ctx.measureText(ch).width + spacing; w -= spacing;
  let cx = x - w / 2;
  for (const ch of str) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + spacing; }
}
function card(key, draw) {
  const id = key + "@" + fw + "x" + fh;
  if (cardCache.has(id)) return cardCache.get(id);
  tcv.width = fw; tcv.height = fh;
  tctx.clearRect(0, 0, fw, fh);
  tctx.textBaseline = "alphabetic"; tctx.fillStyle = "#fff";
  draw(tctx, fw, fh);
  // Unit 3 is scratch: a card first built mid-frame used to land on unit 0 and
  // replace the rendered shot the post pass was about to sample -- every frame
  // with type on it came out black behind the words (stills, 2026-09-18).
  gl.activeTexture(gl.TEXTURE3);
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tcv);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  cardCache.set(id, tx);
  return tx;
}
const FONT = '"Inter", "Helvetica Neue", "DejaVu Sans", sans-serif';
function partyRows() {
  const n = TRIBUTE.rows, rows = [];
  for (let r = 0, at = 0; r < n; r++) {           // even split: 14 -> 4, 4, 3, 3
    const take = Math.ceil((PARTIES.length - at) / (n - r));
    rows.push(PARTIES.slice(at, at + take)); at += take;
  }
  return rows;
}
// One type size for EVERY row -- the largest at which the longest name of all
// fits a column -- because sizing per row made the row holding MEKKA &
// SYMPOSIUM visibly smaller than the rest (stills, 2026-09-18).
let rowPx = 0;
function rowLayout(c, w, h) {
  const cols = Math.max(...partyRows().map(r => r.length)), colW = w * .8 / cols;
  if (!rowPx) {
    rowPx = Math.round(h * .03);
    const width = (nm, px) => { c.font = `300 ${px}px ${FONT}`; let t = 0;
      for (const ch of nm) t += c.measureText(ch).width + px * .28; return t; };
    const longest = Math.max(...PARTIES.map(([nm]) => width(nm, rowPx)));
    rowPx = Math.max(8, Math.floor(rowPx * Math.min(1, colW * .92 / longest)));
  }
  return { colW, px: rowPx };
}
function rowCard(r) {
  const row = partyRows()[r];
  return card("row" + r, (c, w, h) => {
    const { colW, px } = rowLayout(c, w, h), x0 = w / 2 - colW * (row.length - 1) / 2;
    row.forEach(([name, year], k) => {
      const x = x0 + k * colW;
      c.globalAlpha = 1;
      c.font = `300 ${px}px ${FONT}`; track(c, name, x, h * .84, px * .28);
      c.globalAlpha = .7;
      c.font = `300 ${Math.round(px * .72)}px ${FONT}`; track(c, String(year), x, h * .84 + px * 1.5, px * .3);
    });
  });
}
function closeCard() {
  return card("close", (c, w, h) => {
    c.font = `200 ${Math.round(h * .05)}px ${FONT}`; track(c, CLOSE.title, w / 2, h * .82, h * .02);
    c.globalAlpha = .75;
    c.font = `300 ${Math.round(h * .022)}px ${FONT}`; track(c, CLOSE.sub, w / 2, h * .885, h * .01);
  });
}
// Which card is up at time t, and how visible: [texture, alpha] or null.
function cardAt(t) {
  const ease = x => x * x * (3 - 2 * x);
  if (wallNow >= RUNTIME - CLOSE_HOLD) return [closeCard(), ease(Math.min(1, (wallNow - (RUNTIME - CLOSE_HOLD)) / 0.8))];
  const rows = partyRows().length;
  const each = (RUNTIME - CLOSE_HOLD - TRIBUTE.start) / rows;
  const k = (wallNow - TRIBUTE.start) / each, i = Math.floor(k);
  if (k < 0 || i >= rows) return null;
  const f = (k - i) * each;                           // wall seconds into this row
  const a = Math.min(1, f / TRIBUTE.fade, (each - f) / TRIBUTE.fade);
  return a > 0 ? [rowCard(i), ease(a)] : null;
}

// ─── The shot ───────────────────────────────────────────────────────────────
const S_SHOT = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform vec2 uRes; uniform float uT; uniform int uAA;
uniform vec2 uFormToTorus, uTorusToCube, uCarve1, uCarve2, uCarve3;
#define PI 3.14159265
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
// 0 before the window, 1 after it; smootherstep, so every change starts and
// ends at rest -- the difference between motion that looks pro and motion
// that looks keyframed.
float stage(vec2 w){ float x = clamp((uT-w.x)/(w.y-w.x), 0., 1.); return x*x*x*(x*(x*6.-15.)+10.); }

float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }

// The Menger sponge, each level's openings grown by its own amount. A hole is
// carved where c > d; pulling c down by (1-k)*1.2/s keeps a level sealed until
// its k rises, so the openings grow from nothing instead of popping in.
float menger(vec3 p, vec3 k){
  float d = sdBox(p, vec3(1.)), s = 1.;
  for(int m=0; m<3; m++){
    vec3 a = mod(p*s, 2.)-1.; s *= 3.; vec3 r = abs(1.-3.*abs(a));
    float da=max(r.x,r.y), db=max(r.y,r.z), dc=max(r.z,r.x);
    float c = (min(da,min(db,dc))-1.)/s;
    float km = m==0 ? k.x : (m==1 ? k.y : k.z);
    // A level whose turn has not come is SKIPPED, not merely held shut: held
    // shut, its near-zero distances leaked through the torus-to-cube morph as
    // jagged patches (stills at 69 s, 2026-09-18).
    if(km <= 0.) continue;
    d = max(d, c - (1.-km)*1.2/s);
  }
  return d;
}

float map(vec3 p){
  p.xz *= rot(uT*.11); p.xy *= rot(uT*.06);
  float calm = stage(uFormToTorus);
  float amp = mix(.16, .0, calm);
  // the liquid form: long, low-frequency swells, never noisy
  float form = length(p) - 1.2
    + amp*sin(p.x*2.6+uT*.55)*sin(p.y*2.4-uT*.45)*sin(p.z*2.8+uT*.35)
    + amp*.35*sin(p.x*5.-uT*.6)*sin(p.z*4.6+uT*.5);
  float torus = sdTorus(p, vec2(1.1, .42));
  vec3 k = vec3(stage(uCarve1), stage(uCarve2), stage(uCarve3));
  float cube = menger(p*1.05, k)/1.05;
  return mix(mix(form, torus, calm), cube, stage(uTorusToCube));
}
vec3 nrm(vec3 p){ vec2 e=vec2(.001,0);
  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx))); }

// The backdrop: the credits' plasma, slowed and muted to a deep wash.
vec3 plasma(vec2 p){
  float v = sin(p.x*2.2+uT*.12) + sin(p.y*2.6-uT*.1)
          + sin((p.x+p.y)*1.8+uT*.15) + sin(length(p*2.8)-uT*.2);
  vec3 a = vec3(.05,.06,.1), b = vec3(.2,.1,.26), c = vec3(.05,.15,.22);
  return mix(mix(a, b, .5+.5*sin(v*.8)), c, .5+.5*cos(v*.6+1.3));
}
// What the surface reflects: a soft studio -- two broad lights and the wash.
vec3 env(vec3 rd){
  vec3 c = mix(vec3(.02,.025,.04), vec3(.08,.07,.12), smoothstep(-.4,.8,rd.y));
  c += vec3(.9,.85,.8)*smoothstep(.9,.99, dot(rd, normalize(vec3(.7,.6,-.4))))*1.6;    // key softbox
  c += vec3(.35,.45,.8)*smoothstep(.85,.99, dot(rd, normalize(vec3(-.8,.2,.3))))*.6;   // cool rim
  return c;
}

vec3 shade(vec2 p){
  // back far enough that a tumbling cube's corners (sqrt 3) stay in frame
  vec3 ro = vec3(0,0,mix(-6.8,-6.1, smoothstep(0.,120.,uT))), rd = normalize(vec3(p, 1.7));
  float t = 0.; bool hit = false;
  for(int i=0;i<150;i++){ float d = map(ro+rd*t); if(d<.0006){hit=true;break;} t += d*.8; if(t>14.) break; }
  vec3 bg = plasma(p);
  if(!hit) return bg;
  vec3 pos = ro+rd*t, n = nrm(pos);
  // soft occlusion
  float ao = 0.;
  for(int k=1;k<6;k++){ float h=.05*float(k); ao += (h-map(pos+n*h))/float(k); }
  ao = clamp(1.-ao*2.5, 0., 1.);
  // dark glossy metal with a restrained pearl sheen that follows the view angle
  float ndv = max(dot(n,-rd),0.);
  vec3 sheen = .5+.5*cos(2.*PI*(vec3(0.,.33,.67) + ndv*.6 + .08));
  vec3 base = mix(vec3(.1,.11,.14), sheen*.45, .5);
  vec3 L = normalize(vec3(.7,.6,-.4));
  float dif = max(dot(n,L),0.);
  float fre = .04 + .96*pow(1.-ndv, 5.);
  vec3 refl = env(reflect(rd,n));
  float spec = pow(max(dot(reflect(-L,n),-rd),0.), 90.);
  vec3 c = base*(.25+1.1*dif)*ao + refl*mix(.35,1.2,fre)*ao + vec3(1.)*spec;
  // fog into the backdrop at the far edge, so the silhouette sits IN the wash
  return mix(c, bg, smoothstep(8.,11.,t));
}

void main(){
  vec3 c = vec3(0.);
  for(int j=0;j<4;j++) for(int i=0;i<4;i++){
    if(i>=uAA || j>=uAA) continue;
    vec2 off = (vec2(i,j)+.5)/float(uAA) - .5;
    // the object sits a little above centre, clear of the type in the lower third
    c += shade((gl_FragCoord.xy + off - .5*uRes)/uRes.y - vec2(0., .07));
  }
  o = vec4(c/float(uAA*uAA), 1.);
}`;

// ─── Post: soft bloom, gentle vignette, a trace of film grain ───────────────
const S_POST = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uSrc, uCard; uniform vec2 uRes; uniform float uT, uFade, uCardA;
float h1(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec2 d = uv-.5;
  vec3 c = texture(uSrc, uv).rgb;
  vec3 b = vec3(0.);
  for(int i=0;i<16;i++){ float a=float(i)*.3927; for(float r=1.;r<5.;r++){
    b += max(texture(uSrc, uv + vec2(cos(a),sin(a))*r*.007*vec2(uRes.y/uRes.x,1.)).rgb-.6, 0.); } }
  c += b/64.*.9;
  c *= 1. - .35*dot(d,d)*1.8;                          // vignette
  c = c/(1.+c*.15);                                    // gentle shoulder, no clipping
  vec4 k = texture(uCard, uv);                          // the type, over everything
  c = mix(c, vec3(.93,.95,1.), k.a*uCardA*.92);
  c = pow(c, vec3(.95));
  c += (h1(gl_FragCoord.xy + fract(uT*.37)*100.)-.5)*.012;   // a trace of grain
  o = vec4(c*uFade, 1.);
}`;

const SHOT = program(S_SHOT), POST = program(S_POST);
const blankTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, blankTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));

let wallNow = 0;   // cardAt() times the close on the wall clock
function frame(wall) {
  resize();
  // piece-seconds from here on; past RUNTIME the frame is black (see FADE_END)
  wallNow = Math.max(0, wall);
  const t = pieceTime(wall);
  gl.bindFramebuffer(gl.FRAMEBUFFER, NOPOST ? null : fbo); gl.viewport(0, 0, fw, fh);
  gl.useProgram(SHOT.p); const u = SHOT.u;
  gl.uniform2f(u.uRes, fw, fh); gl.uniform1f(u.uT, t); gl.uniform1i(u.uAA, AA);
  gl.uniform2fv(u.uFormToTorus, STAGES.formToTorus);
  gl.uniform2fv(u.uTorusToCube, STAGES.torusToCube);
  gl.uniform2fv(u.uCarve1, STAGES.carve1);
  gl.uniform2fv(u.uCarve2, STAGES.carve2);
  gl.uniform2fv(u.uCarve3, STAGES.carve3);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (NOPOST) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, fw, fh);
  gl.useProgram(POST.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(POST.u.uSrc, 0);
  gl.uniform2f(POST.u.uRes, fw, fh); gl.uniform1f(POST.u.uT, t);
  const cd = cardAt(t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, cd ? cd[0] : blankTex); gl.uniform1i(POST.u.uCard, 1);
  gl.uniform1f(POST.u.uCardA, cd ? cd[1] : 0);
  // A quick fade up from black, and a fade out to black over the last FADE_END
  // wall seconds -- picture and type together -- after which it stays black.
  const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  gl.uniform1f(POST.u.uFade, ease(wallNow / 0.7) * (1 - ease((wallNow - (RUNTIME - FADE_END)) / FADE_END)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

window.__length = RUNTIME;   // wall-clock seconds, for the video render
if (RENDER) {
  addEventListener("load", async () => {
    const n = Math.round(RUNTIME * FPS);
    for (let i = 0; i <= n; i++) {
      frame(i / FPS); gl.finish();
      const png = await new Promise(r => cv.toBlob(r, "image/png"));
      const res = await fetch("/frame?i=" + i, { method: "POST", body: png });
      if (!res.ok) { document.title = "error at frame " + i; return; }
    }
    await fetch("/done?frames=" + (n + 1), { method: "POST" });
    document.title = "done";
  });
} else if (FIXED_T !== null) {
  // After layout, so the frame is drawn at the size the screenshot captures.
  addEventListener("load", () => requestAnimationFrame(() => {
    frame(FIXED_T); gl.finish();
    window.__ready = true; document.title = "ready";
  }));
} else {
  const t0 = performance.now();
  const tick = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
