/* firstboot.html — part 2 of the install show: the first-boot build.
   Shown full screen by kldload-firstboot-kiosk.service (cage + Firefox) on an
   installed machine whose install asked for something to build (Kubernetes, golden
   images, AI models), from the reboot until the build settles; the operator's rule
   (fiend, 2026-09-14): "after first reboot the slide show, part 2, should resume
   ASAP, unless it's core, server or a desktop with no options".
   What is live: the output window is /api/install-log (the build log being written,
   cleaned and redacted by kldload-firstboot-show logtail) and the stage row is
   /api/install-progress (autodeploy's phase plan). The scenes, slides and HUD
   counters are the show. Served on the loopback-only listener 127.0.0.1:8099 so the
   kiosk browser needs no certificate trust.

@keyframes e-zoom { from { transform: scale(1.35); filter: blur(8px); opacity: 0; } to { transform: none; filter: none; opacity: 1; } }
.title.e-chroma { position: relative; }

  mix-blend-mode: screen; text-shadow: none; animation: 1.6s cubic-bezier(.16, .84, .24, 1) both; }

.title .w { display: inline-block; white-space: nowrap; }
.title .c { visibility: hidden; }

<script>
(function () {

  var C = { vec: "#3dff88", tube: "#b44dff", beam: "#21e6ff", hit: "#ff3b5c", amber: "#ffcf4d", ink: "#e9f3ea" };

  function pick(a) { return a[Math.random() * a.length | 0]; }
  function pad(n, w) { n = String(Math.max(0, n | 0)); while (n.length < w) n = "0" + n; return n; }
  function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }

  var F = {

    "O":["01110","10001","10001","10001","10001","10001","01110"], "P":["11110","10001","10001","11110","10000","10000","10000"],
    "Q":["01110","10001","10001","10001","10101","10010","01101"], "R":["11110","10001","10001","11110","10100","10010","10001"],
    "S":["01111","10000","10000","01110","00001","00001","11110"], "T":["11111","00100","00100","00100","00100","00100","00100"],

     "*Full* carries every mirror and installs with the internet unplugged. *Net* is the same installer without the payload. *Core* is ZFS and the installer, nothing else."],
    ["Editions", "Three ways onto a machine",
     "Boot the key, netboot from another machine, or receive a golden. All three land the same system, and the one you pick is about logistics rather than capability."],
    ["Editions", "Choose which mirrors you carry",
     "Build an image with Debian, Fedora and Enterprise Linux mirrors, or only the one you use. The image is sized by the *decision you made*, not by everything that might be needed."],
    ["Learn", "The documentation is the reason",
     "Not a feature list. Why a dataset layout keeps a rollback consistent, why a zvol under a filesystem costs you, what an eBPF latency histogram is actually telling you."],
    ["Learn", "Every incident became a comment",
     "The code carries the dates, the machines and the symptoms of things that went wrong. You are not reading someone's theory, you are reading *what actually happened* and what it cost."],
    ["vmxplore", "A window, or a terminal",
     "vmxplore is the graphical build; vmx is the same code compiled as a static terminal tool and installed on every profile. A server with no display still gets the estate, the verbs and a serial console."],
    ["vmxplore", "Every verb is a plain command",
     "Each action is a short plan of virsh and zfs commands, shown before it runs. If a step fails partway through, the undo steps already planned for it run newest first."],
    ["vmxplore", "No retype-the-name dialogs",
     "Force off, delete and rollback act when you press them. A VM here is remade from a golden in seconds, so the safeguard is a record of what ran rather than a box asking whether you meant it."],
    ["vmxplore", "Every VM command, with its exit code",
     "vmxplore appends the time, the user, the exact command and how it exited to */var/log/kldload/vmx.log*. The history of the estate is a text file you can grep."],
    ["vmxplore", "Resize all three layers",
     "Growing a disk enlarges the zvol, then the partition inside the guest, then the filesystem, and reports the filesystem size as the result. It only grows: shrinking under a mounted filesystem destroys it."],
    ["vmxplore", "Snapshots sorted by who made them",
     "A rules file groups snapshot names into human, golden, replication, checkpoint and scheduled noise, so the one you took by hand is not buried under hundreds of automatic ones."],
    ["vmxplore", "Make Golden is one menu item",
     "It shuts the VM down, seals it with kldload-seal and snapshots its disks as @golden. Cloning from that golden is then one zfs clone per disk and a fresh identity for every copy."],
    ["vmxplore", "Each clone gets its own name",
     "Clones once inherited the golden's cloud-init seed, and three of them booted calling themselves the golden (2026-08-17). Now every clone gets a seed with its *own hostname* and instance-id."],
    ["vmxplore", "Five Fedora boxes, one gesture",
     "EZ Fleet builds a VM from a cloud image, turns it into a golden and clones it as many times as you ask. It waits for the disk to stop growing before sealing, not for a fixed pause a desktop would outrun."],
    ["vmxplore", "Host keys are checked",
     "The libvirt connection to a remote hypervisor fails closed on an unknown or changed host key. The ssh commands behind the verbs set their own policy instead of inheriting a lab machine's relaxed one."],
    ["vmxplore", "Guest consoles stay on loopback",
     "VMs built by vmxplore bind VNC to 127.0.0.1. On a remote host the Screen tab reaches it through an ssh tunnel, so no guest framebuffer is offered to the network."],
    ["vmxplore", "Sound only where it will work",
     "Every VM gets a sound card, but host audio is wired in only after a real access test as the qemu user, because qemu refuses to start a guest whose audio backend it cannot reach."],
    ["No images", "Sparse from the first write",
     "A new VM disk is a sparse zvol attached as virtio. A large disk costs only the blocks the guest has actually written, and it snapshots and clones like any other dataset."],
    ["No images", "Grow a disk while the VM runs",
     "In zxplore, select the zvol behind a running VM, edit its size and press Enter. The volume is larger at once, with no virsh step and no maintenance window."],
    ["No images", "A VM rollback is a zfs rollback",
     "Rolling a VM back needs it shut off, runs zfs rollback -r on its disk, and the warning tells you how many newer snapshots will be removed before you commit to it."],
    ["No images", "Different data, different datasets",
     "VM disks live under rpool/vms with lz4 compression, while installer ISOs sit on a dataset of their own with zstd, because the two are written and read in completely different ways."],
    ["No images", "Windows, cloned like Linux",
     "kvm-win builds Windows 11 or Server goldens unattended on q35 with Secure Boot firmware and a software TPM 2.0, then sysprep. Every Windows VM after that is a zfs clone."],
    ["No images", "Windows reads the same seed",
     "Cloudbase-Init in the Windows golden consumes the same NoCloud seed that Linux clones use, so hostname, admin password and network arrive the way cloud-init delivers them."],
    ["No images", "No Windows bits on the media",
     "Windows media is fetched only when you build a golden: evaluation images through Mido, or your own ISO with --iso. The kldload image itself carries nothing from Microsoft."],
    ["MicroVMs", "kfire, the microVM verb set",
     "golden, clone, list, stop, start, destroy, ssh and console: the same lifecycle as a full VM, so there is never a microVM running that the estate cannot see or remove."],
    ["MicroVMs", "Jailed, not root",
     "When the Firecracker jailer is present, each instance runs as the unprivileged kfire user in its own chroot under a cgroup, with its tap device owned by that user rather than root."],
    ["MicroVMs", "Ten clones in under three seconds",
     "Measured on one desktop (onyx, 2026-09-05): ten Web Stack microVMs cloned in *2.7 seconds*, each serving HTTP about seven seconds later, with 7.6 GB of host memory still free."],
    ["MicroVMs", "Same disk, same kernel",
     "A kfire golden takes the kernel and initramfs from the VM's own root filesystem. Nothing inside the guest changes: the microVM boots the same disk libvirt booted, with the same services."],
    ["MicroVMs", "A clean shutdown first",
     "Stopping a microVM sends Ctrl-Alt-Del over its API socket and waits for the guest to exit by itself. SIGTERM comes only after the guest has had its chance to shut down properly."],
    ["MicroVMs", "Identity from a seed, not the image",
     "Each clone gets a small read-only NoCloud seed with its own instance-id and hostname. cloud-init sees a new machine and rewrites the network for Firecracker's own NIC."],
    ["MicroVMs", "Counted beside everything else",
     "Every fifteen seconds the number of microVMs, how many are running and how many came from each golden are written for node_exporter, so Grafana shows the Firecracker estate too."],
    ["Containers", "Podman layers are datasets",
     "On KVM installs Podman's storage driver is ZFS, on a dataset created for it. Every image layer is a dataset, so layers share blocks and inherit the pool's compression."],
    ["Containers", "Docker lands on ZFS too",
     "The installer writes Docker's daemon config with the ZFS storage driver and creates its dataset in advance, so Docker installed later lands on ZFS without anyone remembering to set it."],
    ["Containers", "Container state survives a rollback",
     "Where they are installed, Podman, Docker, containerd, etcd and kubelet data each have their own dataset. Roll the system back and images and cluster state stay exactly where they were."],
    ["Containers", "Containers by name, storage beside them",
     "zxplore's Containers tab lists containers and images from Docker or Podman next to the datasets they occupy, and says plainly when the driver in use is overlay rather than ZFS."],
    ["Containers", "etcd gets 8K records",
     "Kubernetes' etcd gets a dataset with an 8K record size, and containerd one with lz4 and access times off. Each is tuned for what it actually writes instead of sharing one default."],
    ["Mesh", "Keys minted after the clone",
     "A key baked into a golden would be identical on every clone. kvm-mesh generates each private key inside its guest after cloning, and *only the public half* ever leaves the machine."],
    ["Mesh", "Proven by handshake",
     "A mesh is not finished because an interface exists. kvm-mesh waits for every pair of peers to complete a handshake, and exits with failure if any one of them has not."],
    ["Mesh", "The hypervisor joins as .254",
     "The host takes the .254 address on each mesh it builds and reaches its guests over the libvirt bridge. No physical NIC is involved, so it works with the network cable unplugged."],
    ["Mesh", "Every appliance on its own plane",
     "An appliance built on a kldload host gets a WireGuard mesh named after it on a free 10.254 subnet, so a media server and a web stack never share a private network by accident."],
    ["Mesh", "Alive, quiet, stale or never",
     "The mesh console grades each peer by its last handshake: under three minutes is alive, under thirty is quiet, anything older is stale, and never means it has not spoken at all."],
    ["Mesh", "Enrollment is for every VM",
     "kldload-enroll puts any VM, however it was made, on the mesh and in the inventory. A sweep runs it every ten minutes, and re-running it only adds the peers that are missing."],
    ["WireGuard", "Two planes for a cluster",
     "Kubernetes nodes carry two WireGuard interfaces: wg-mgmt on 10.250.0.0/24 for SSH and monitoring, and wg-k8s on 10.251.0.0/24 for the API server, kubelet and pod traffic."],
    ["WireGuard", "The kubelet is pinned to the tunnel",
     "kube-network pin-kubelet sets each node's Kubernetes address to its wg-k8s IP, so the traffic between cluster nodes stays inside the encrypted plane instead of the bridge."],
    ["WireGuard", "A firewall that drops by default",
     "kube-network nft writes an nftables policy that drops input and forwarding unless traffic arrives on the mesh, belongs to the pod network, or is SSH, the API server or a NodePort."],
    ["WireGuard", "A key at install time",
     "Set KLDLOAD_WIREGUARD=1 in the answers file and the installer generates a private and public key for wg0 with mode 600, ready for you to add an address and peers."],
    ["WireGuard", "Keys scrubbed from a live session",
     "On the live media, kldload-poof clears WireGuard private keys out of running interfaces before you walk away. An installed system refuses to run it and relies on its own encryption."],
    ["Apps", "Twelve appliances, born enrolled",
     "Build > Appliance, or vmx --appliance, turns a VM into a finished service. On a kldload host each one joins its own mesh, gets a certificate from the local CA and lands in the inventory."],
    ["Apps", "Web Stack",
     "nginx in front of PHP-FPM, with PostgreSQL and Valkey on their own pool and listening on loopback only. /healthz proves the stack by querying both databases, not by checking that a unit is active."],
    ["Apps", "LAMP Stack",
     "Apache serving PHP, MariaDB on loopback with its data on a 16K-record dataset to match InnoDB pages. The example page writes a visit to the database and reads it back on every load."],
    ["Apps", "Jellyfin on ZFS",
     "The free-software media server on tuned datasets: one per film or show, a 16K-record library because it is SQLite, and a cache never snapshotted. Fill in the admin fields and setup runs headless."],
    ["Apps", "Plex on ZFS",
     "Each title gets its own dataset with 1M records and compression off, the library sits on 8K records, and transcodes stay out of snapshots. Send or quota one film without touching the rest."],
    ["Apps", "Seedbox",
     "qBittorrent downloading to an lz4 landing dataset. Give it VPN details and all outbound traffic is forced through WireGuard: if the tunnel drops, torrents stop instead of leaking your address."],
    ["Apps", "Icecast Stations",
     "A rack of independent Icecast servers where each station is its own systemd unit, port and dataset. Restarting station seven touches one stream, and add-station creates the next one."],
    ["Apps", "SDR Station",
     "OpenWebRX puts a HackRF or RTL-SDR waterfall in the browser, with SoapyRemote for desktop clients. The radio attaches by USB passthrough, and IQ captures get an uncompressed 1M-record dataset."],
    ["Apps", "Tvheadend DVR",
     "Over-the-air and satellite TV in, recordings out to a dataset with compression off and a quota, so a season pass cannot fill the pool. A USB tuner on the host attaches automatically."],
    ["Apps", "AdGuard Home",
     "Network-wide DNS blocking of ads and trackers, with DoH and DoT. The release is pinned and checked against upstream's SHA-256, and the build fails loudly if anything else still holds port 53."],
    ["Apps", "Syncthing",
     "Continuous file sync between your own machines, with no server and no cloud. It runs as its own user on a dataset, installed from Syncthing's repository with the signing key checked first."],
    ["Apps", "VDI Desktop",
     "A headless XFCE desktop streamed with sound to any browser over WebRTC, HLS or SRT, with no client to install. Every clone shows its own hostname and address on its panel."],
    ["Apps", "RDP Desktop",
     "An XFCE desktop over RDP for mstsc, Remmina or FreeRDP, with keyboard, mouse, clipboard and sound. Clone it five times and you have five desktops, each with its own login."],
    ["Transparency", "The install keeps its own logs",
     "Every installed system holds /root/kldload-install-logs: the ZFS, bootloader, security and bootstrap logs from the run that built it. What the installer did is already on the disk."],
    ["Transparency", "Every setting, secrets redacted",
     "effective-config.env records every setting the install actually used. Anything named like a password, passphrase, key or token is written as redacted, matched by *pattern*, not by a list."],
    ["Reproducible", "Which build installed this machine",
     "/etc/kldload/install.attest records the installer version, the SHA-256 of the root image it came from, the install date, the disk, the distribution and the profile."],
    ["Reproducible", "What the install was asked for",
     "/etc/kldload/install-manifest.env keeps the distribution, profile and options this machine was installed with, and first boot reads it to decide what to build."],
    ["Recovery", "A factory snapshot of every dataset",
     "Before the bootloader is written, the installer snapshots the whole pool recursively as rpool@install with a timestamp. The machine exactly as it was delivered is never lost."],
    ["Inside", "First boot tests itself",
     "On non-core installs the smoke suites ship with the machine, and first boot runs them into /root/kldload-smoke-report.txt. The result of checking this machine lives on this machine."],
    ["Inside", "Proof that Ansible can reach",
     "At first boot a unit checks that Ansible reaches the estate and writes /root/kldload-ansible-report.txt, so whether inventory, mesh and SSH line up is answered before you need it."],
    ["Inside", "What is pinned, in one file",
     "/var/lib/kldload/platform-holds.list names exactly which packages are held, written after the pins are read back from the package manager. The dashboard reads that file instead of guessing."],
    ["Inside", "A doctor that prescribes",
     "kldload-doctor profiles the machine against a known-good baseline, marks each check as passing, drifting or failed, and gives the exact command that fixes each one, as JSON."],
    ["Inside", "Tests for the installed system",
     "Beyond the checks run against every ISO, suites cover core, server, desktop and KVM installs, feature checks, a rollback exercise and a disaster-recovery drill that proves a restore by canary."],
    ["Transparency", "A debug bundle without secrets",
     "kldload-debug-bundle gathers install logs, journals, pool state, boot entries and module state into one tarball in seconds. The MOK private key and WireGuard keys are deliberately left out."],
    ["Transparency", "Controllers named, gaps admitted",
     "kldload-hba reports every storage controller, its driver, firmware and the drives behind it using only redistributable tools. Where only a vendor utility could answer, it says so."],
    ["Learn", "A gate is proven to fail",
     "gate-selftest.sh breaks things on purpose and checks that each gate goes red. It exists because two gates had reported green on broken systems for months before anyone noticed."],
    ["Learn", "Debt that can only shrink",
     "smoke-build counts silent error swallows and scripts without strict mode against a recorded baseline. The numbers may fall and never rise, so old debt shrinks while new code obeys the rule."],
    ["Learn", "The machine and the date",
     "The netboot menu tries more than one network port because on fiend, 2026-09-11, the NIC that booted was not net0. Comments like that one keep the fix and its reason in the same place."],
    ["Consent", "Every arming is on the record",
     "Arming, deploying and disarming a machine are written to the system journal with the user who did it. journalctl -t kldload-netboot answers who told a machine to reinstall."],
    ["Layout", "/tmp cannot run what it holds",
     "Temporary files get their own dataset with exec, setuid and device nodes switched off. Something dropped into /tmp can sit there, but it cannot be executed from there."],
    ["Layout", "Metadata on fast disks",
     "Name one or two fast disks as a special vdev in the answers file and the pool keeps its metadata there, mirrored when you give two. Spinning disks keep the bulk data, flash answers the lookups."],
    ["The substrate", "Pools built for the distro that reads them",
     "The installer runs a newer OpenZFS than some targets ship, so the pool is created with a *compatibility profile* for the chosen distribution. Debian or Rocky opens it read-write."],
    ["The substrate", "Single, mirror, RAIDZ or RAID10",
     "The root pool can be one disk, a two-disk mirror, RAIDZ1 across three or more, or two mirrored pairs striped. The choice is one line in an answers file, and the EFI partition keeps its own disk."],
    ["Undo", "apt rollback is a real command",
     "Plain apt and dnf are wrapped to take a snapshot before any change, and both gained one verb. rollback clones the last pre-transaction snapshot into a new boot environment and reboots into it."],
    ["Undo", "Rolling back the kernel keeps your files",
     "Only the root environment moves. /home, /srv and VM disks stay exactly where they are, and a staged rollback can be cancelled before the reboot with nothing destroyed along the way."],
    ["Snapshots", "Weeks, months and a year back",
     "Boot environments keep seven dailies, twelve weeklies and twelve monthlies. Home, /srv and /var/lib add a yearly anchor, all pruned automatically so history never fills the pool."],
    ["Integrity", "Every pool event lands in Loki",
     "Checksum errors, resilvers, trims and vdev state changes are pushed from the ZFS event daemon into Loki as they happen. The drive that started complaining last week is a search, not a guess."],
    ["Encryption", "AES-256-GCM before the first file",
     "Choose encryption and the pool is created with aes-256-gcm and a passphrase before anything is written to it. ZFSBootMenu asks for that passphrase at every boot."],
    ["Encryption", "A restore does not need the backup's key",
     "A machine rebuilt from its archive receives the data decrypted and applies its own encryption policy, so it never needs the backup server's passphrase to mount its own filesystem."],
    ["Recovery", "The boot chain checks itself",
     "A firmware update that wipes boot entries, or a package that rewrites the fallback loader, is caught on the next boot. kldload-boot-assert recreates the entry, puts it first and logs the repair."],
    ["Recovery", "What a pool backup does not hold",
     "The EFI partition, hostid, kernel version and NIC address all live outside replicated data. kldload-boot-manifest records them as JSON, and can keep the EFI partition as a tar, so a rebuild never guesses."],
    ["Recovery", "A restore is verified, not assumed",
     "After receiving the pool, kldload-restore-machine checks the kernel is on disk, bootfs is set, the EFI partition is populated and fstab agrees with it. An unbootable result is reported as a failure."],
    ["Recovery", "Identity stripped before it boots",
     "A boot environment replicated to twenty machines would give all twenty one machine-id and one set of SSH host keys. kldload-restamp-identity clears them and keeps the hostid the pool expects."],
    ["zxplore", "Design a pool before you build it",
     "Tick the disks and the Builder proposes mirrors, RAIDZ and dRAID layouts with usable space and what each survives. It shows the exact zpool create line, and makes you type the pool name to build it."],
    ["zxplore", "Counters read as sentences",
     "Observe turns one second of kstats into verdicts: sync writes landing on the main pool, an ARC capped far below RAM, one vdev slower than its siblings. Each names the setting that changes it."],
    ["zxplore", "Passphrases never reach argv",
     "Unlocking an encrypted dataset passes the passphrase on standard input. It never appears in a process listing, and it is kept out of every log, zxplore's own audit log included."],
    ["Observability", "A cockpit on the function keys",
     "In the kldload terminal, F5 through F12 open themed panes: disk latency, syscalls, TCP, Cilium state, top, ZFS internals, tracing and kernel pressure. Press the same key again and they close."],
    ["Observability", "ZFS's own debug log, searchable",
     "The module's internal debug buffer is not a file anything can tail. A small collector turns it into one every ten seconds, so ZFS's own messages sit in Loki beside the rest of the machine."],
    ["Certificates", "Trusted in the browser, no click",
     "The local CA root is imported into Chrome's certificate store for every user, and imported again whenever certificates rotate. The web console opens with no warning and no flag to ignore one."],
    ["Learn", "Ask the documentation a question",
     "kai sends your question to a local retrieval service along with this machine's health summary, pool status and memory. The answer is drawn from the shipped docs, on hardware you own."],
    ["Export", "Install straight to an image",
     "Set an export format in the answers file and the installer seals the finished disk and writes qcow2, raw, VHD, VMDK or OVA instead of leaving a bootable machine, optionally copying it away over scp."],
    ["Goldens", "Sealed images find any cloud",
     "Sealing clears identity and drops in a cloud-init config listing every datasource, so the same image picks up its identity on NoCloud, OpenStack, EC2, Azure or OVF without edits."],
    ["Secure Boot", "One install, one signing key",
     "Each install generates its own Machine Owner Key, signs the ZFS module and ZFSBootMenu with it, and queues it for enrolment. An answers file can supply a key you already manage instead."],
    ["Secure Boot", "Stale keys found and cleared",
     "Reinstalls leave old keys in firmware while the one that matters may never enrol. kldload-mok-repair lists them, flags the stale ones and queues a reset plus the current key, even from the live media."],
    ["Darksite", "AI without a network",
     "The Ollama runtime, the Open WebUI container and Whisper speech weights can ride on the media. A carried copy that is present but broken is a failure, never a reason to reach for the internet."],
    ["Darksite", "Mirrors leave after the install",
     "Once first boot has used the carried package mirrors, they are removed to give the space back. Mark the machine as a LAN mirror and it keeps them and serves them to its neighbours instead."],
    ["Reproducible", "The kernel does not move on its own",
     "Kernel, ZFS, boot chain and NVIDIA packages are pinned at first boot with apt, dnf or pacman's own mechanism, then read back to prove the pins held. The kernel moves when you decide."],
    ["Workloads", "A lean machine unless you ask",
     "Kubernetes, AI and the ZFS test lab stay off unless the answers file switches them on, while metrics are on for every profile except core. First boot builds what you asked for and nothing more."],
    ["Clones", "Running guests come back",
     "VMs that were running when the host shut down are started again at boot, fifteen seconds apart. Shutdown grants only a short grace, because a clone can be remade from its golden in moments."],
    ["Kubernetes", "Born able to grow",
     "Every cluster is initialised with a floating control-plane address, even with one control plane. That is the step that cannot be added later, so a single-node cluster can still grow to three."],
    ["Kubernetes", "The API address follows the leader",
     "With more than one control plane, kube-vip holds the API address on whichever node owns the lease. Lose that node and the address moves, and clients keep using the same endpoint."],
    ["Kubernetes", "Blue/green with a safety check",
     "kube-bluegreen previews the idle track with real requests, refuses to cut over until every replica is Ready, then moves the Service and confirms the endpoints actually moved."],
    ["Netboot", "Every network port is tried",
     "The boot menu probes the first four interfaces and chains the first one that has been armed, so the cable does not have to be in the port the firmware happens to try first."],
    ["Netboot", "It will not take your office offline",
     "Standalone DHCP mode refuses the interface that carries the default route unless forced, because a second DHCP server on a production network is how a lab takes an office down."],
    ["Consent", "A bad batch arms nothing",
     "arm-all checks a whole directory of answers files first. Two files for one MAC, or two machines sharing a hostname, and nothing is armed at all. A file that fails validation is named."],
    ["klab", "Blue and green sites of real VMs",
     "klab deploys its goldens as a blue site and a green one. Test a change in green, promote green to blue when it holds, or roll blue back to its previous snapshot when it does not."],
    ["Yours", "Small tools you can read",
     "kdir makes a dataset where you would make a directory, kclone copies one instantly, and kdf shows compression and quotas. Each is a short script over plain zfs you could type yourself."],
    ["Obsolete", "No sysprep checklist",
     "No wiki page of files to delete before cloning. Sealing clears machine-id, host keys, hostid, cloud-init state and journals in one step, and leaves a marker saying it was done."]

    function all(list) { Array.prototype.forEach.call(list, function (c) { c.classList.add("on"); }); }
    function finish() { el.classList.add("typed"); if (tc.length) tc[tc.length - 1].classList.add("tail"); }
    if (reduce) { all(kc); all(tc); el.classList.add("typed"); return; }
    var mode, body;
    do { mode = pick(ENTRANCES); } while (mode === lastEntrance);
    do { body = pick(BODIES); } while (body === lastBody);
    lastEntrance = mode; lastBody = body;
    if (body !== "wipe") el.classList.add("b-" + body);
    if (mode === "type") {
      var ki = 0, tix = 0, flick = 0, prev = null;
      typer = setInterval(function () {
        if (ki < kc.length) { kc[ki++].classList.add("on"); return; }
        if (tix < tc.length) {
          var c = tc[tix];
          if (!flick) { if (prev) prev.classList.remove("tail"); c.classList.add("on", "scr", "tail"); prev = c; flick = 2 + (Math.random() * 2 | 0); }
          if (c.dataset.ch === " " || --flick <= 0) { c.textContent = c.dataset.ch; c.classList.remove("scr"); flick = 0; tix++; }
          else c.textContent = GLYPHS[Math.random() * GLYPHS.length | 0];
          return;
        }
        clearInterval(typer); el.classList.add("typed");
      }, 30);
      return;
    }
    all(kc);
    if (mode === "decode") {
      // every letter on screen as noise at once, resolving left to right (part 1's decode)
      all(tc);
      var t0 = performance.now(), n = tc.length;
      typer = setInterval(function () {
        var k = Math.min(1, (performance.now() - t0) / 850);
        for (var i = 0; i < n; i++) {
          var c = tc[i];
          if (i / n < k * 1.15 - .12) { if (c.classList.contains("scr")) { c.textContent = c.dataset.ch; c.classList.remove("scr"); } }
          else { c.textContent = GLYPHS[Math.random() * GLYPHS.length | 0]; c.classList.add("scr"); }
        }
        if (k >= 1) { clearInterval(typer); Array.prototype.forEach.call(tc, function (c) { c.textContent = c.dataset.ch; c.classList.remove("scr"); }); finish(); }
      }, 30);
      return;
    }
    if (mode === "drop") {
      ti.classList.add("e-drop");
      Array.prototype.forEach.call(tc, function (c, i) { arriveTimers.push(setTimeout(function () { c.classList.add("on"); }, i * 28)); });
      arriveTimers.push(setTimeout(finish, tc.length * 28 + 560));
      return;
    }
    all(tc);
    ti.classList.add("e-" + mode);
    arriveTimers.push(setTimeout(finish, ENTRANCE_MS[mode] || 600));
  }
  var si = 0; wrap.children[0].classList.add("on"); arrive(wrap.children[0]);
  setInterval(function () {
    var old = wrap.children[si]; old.classList.remove("on");
    si = (si + 1) % SLIDES.length; wrap.children[si].classList.add("on"); arrive(wrap.children[si]); onSlide();
  }, 13000); // 13 s a slide: 10 was too short to read a body (operator, 2026-09-15)

  // ── live data ──────────────────────────────────────────────────────────────
  // Both endpoints are plain GETs on this machine's web UI. A failed poll keeps the
  // last good text on screen: the show must never go blank because one request
  // raced a restart of the web UI.
  var out = document.getElementById("out-lines"), outSrc = document.getElementById("out-src"), lastLog = "";
  // Some steps print nothing for minutes (klab waiting for a site's VMs to boot sat
  // silent for 16 minutes on 6-full), and a still window reads as a stuck install
  // (operator on fiend, 2026-09-15: "the output window appears to have stopped").
  // After 30 s without a new line the header says how long it has been quiet.
  var srcName = "", lastChange = Date.now();
  function quietLabel() {
    var q = Math.floor((Date.now() - lastChange) / 1000);
    var name = srcName || "build log";
    outSrc.textContent = q < 30 ? name : name + "  \u00b7  quiet " + (q >= 60 ? Math.floor(q / 60) + "m " : "") + (q % 60) + "s, still working";
  }
  setInterval(quietLabel, 1000);
  function showLines(lines) {
    var key = lines.join("\n"); if (key === lastLog) return; lastLog = key; lastChange = Date.now();
    while (out.firstChild) out.removeChild(out.firstChild);
    lines.slice(-8).forEach(function (l) { var d = document.createElement("div"); d.textContent = l; out.appendChild(d); });
  }
  showLines(["[first boot] starting: the build log appears here as soon as it is written"]);
  function pollLog() {
    fetch("/api/install-log", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j) return;
      if (j.source) { srcName = j.source; quietLabel(); }
      if (j.lines && j.lines.length) showLines(j.lines);
    }).catch(function () { /* web UI restarting: keep the last lines */ });
  }
  pollLog(); setInterval(pollLog, 2000);

  var sw = document.getElementById("stages"), lastPlan = "", readyAnnounced = false;
  function drawStages(p) {
    var rows = [["first boot", p && p.plan && p.plan.length ? "done" : "run"]];
    ((p && p.plan) || []).forEach(function (ph) { rows.push([ph.name, ph.state === "done" ? "done" : ph.state === "running" ? "run" : ph.state === "failed" ? "fail" : ""]); });
    var key = JSON.stringify(rows); if (key === lastPlan) return; lastPlan = key;
    while (sw.firstChild) sw.removeChild(sw.firstChild);
    rows.forEach(function (r, n) { var e = document.createElement("span"); e.className = "st " + r[1]; e.textContent = "stage " + (n + 1) + " " + r[0]; sw.appendChild(e); });
  }
  drawStages(null);
  function pollProgress() {
    fetch("/api/install-progress", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
      if (!p) return;
      drawStages(p);
      if (p.stage === "converge" && !p.running && !readyAnnounced) { readyAnnounced = true; allcall("the machine is ready. handing it over"); }
    }).catch(function () { /* web UI restarting: keep the last plan */ });
  }
  pollProgress(); setInterval(pollProgress, 3000);

  addEventListener("resize", function () { size(); if (cur >= 0) buildBack(cur); }); size();
  var want = parseInt(Q.get("scene"), 10);
  if (want >= 1 && want <= SCENES.length) start(want - 1); else { if (!LAB) loadBag(); advance(); }
  // ?still=N: run N seconds of the scene at a fixed 30 fps before the first paint.
  // For screenshots: a headless browser barely advances animation frames.
  var still = parseFloat(Q.get("still"));
  if (still > 0) { var stepDt = 1 / 30; for (var fN = 0; fN < still * 30; fN++) { clock += stepDt; cx.fillStyle = "#02030a"; cx.fillRect(0, 0, W, H); SCENES[cur].draw(clock, stepDt); nextBeat -= stepDt; if (nextBeat <= 0) { SCENES[cur].event(); nextBeat = rand(SCENES[cur].beat[0], SCENES[cur].beat[1]); } } wipe = 0; curAt = clock - 4; }
  allcall("stage 2 begins. the machine builds itself");
  requestAnimationFrame(frame);
})();
</script>
