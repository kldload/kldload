---
# Runs against a freshly booted cloud image VM. Does the work that used to
# sit inside cloud-init runcmd — which was unreliable across distros.
#
# Preconditions (handled by minimal cloud-init):
#   - SSH is up, root password is kldload, PermitRootLogin yes
#   - Host has DHCP
#
# After this play: kube-setup has run, firewalld is off, /tmp/kube-golden-ready
# exists. The caller (kube-cluster) then seals the image.

- name: Provision kldload golden VM
  hosts: all
  become: true
  gather_facts: true
  vars:
    kube_setup_timeout: 1500  # 25 min for package installs across slow mirrors

  tasks:
    - name: Detect distro family
      set_fact:
        is_deb: "{{ ansible_os_family == 'Debian' }}"
        is_rpm: "{{ ansible_os_family in ['RedHat', 'Rocky', 'AlmaLinux'] }}"

    - name: Disable firewalld (RPM)
      when: is_rpm
      systemd:
        name: firewalld
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Disable ufw (Debian/Ubuntu)
      when: is_deb
      systemd:
        name: ufw
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Ensure SSH hardening drop-in exists
      copy:
        dest: /etc/ssh/sshd_config.d/99-kldload.conf
        content: |
          PermitRootLogin yes
          PasswordAuthentication yes
          MaxStartups 20:30:60
        mode: "0644"

    - name: Reload sshd
      systemd:
        name: "{{ 'ssh' if is_deb else 'sshd' }}"
        state: reloaded
      failed_when: false

    - name: Install qemu-guest-agent (hypervisor visibility)
      # WHY HERE AND NOT IN THE SEED: kube-cluster asks for this in a
      # cloud-init runcmd, and cloud-init does not run on these images —
      # cloud-init.target was never enabled, so the seed is inert. The result
      # was that EVERY k8s node reported "no-agent" in vmxplore (.107,
      # 2026-08-22, all nine of them) and `virsh domifaddr` returned nothing
      # for any of them, which is why the enrollment sweep had to fall back to
      # matching DHCP leases by MAC.
      #
      # Without the agent the hypervisor cannot read a guest's addresses, can
      # only stop it by ACPI, and every tool that asks libvirt "what is this
      # VM's IP" gets silence. Ansible runs for certain, so the install goes
      # where the certainty is.
      package:
        name: qemu-guest-agent
        state: present
      failed_when: false

    - name: Enable qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      failed_when: false

    - name: Verify the agent is actually there
      # Verify the OUTCOME: `package` returns ok on plenty of states that
      # leave no binary, and a golden that silently lacks the agent clones
      # into a whole fleet that libvirt cannot see into.
      stat:
        path: /usr/sbin/qemu-ga
      register: _qga

    - name: Report a missing agent loudly
      debug:
        msg: >-
          WARNING: qemu-guest-agent is NOT installed in this golden — every
          clone of it will show no-agent and report no IP to the hypervisor.
      when: not _qga.stat.exists

    - name: Disable swap (Kubernetes requirement)
      shell: |
        swapoff -a || true
        sed -i.bak -E 's@^([^#].*\sswap\s.*)$@#\1@' /etc/fstab || true
      changed_when: false

    - name: Copy kube-* tools into the VM
      copy:
        src: "/usr/local/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
      loop:
        - kube-setup
        - kube-init
        - kube-join
        - kube-network
        - kube-status
        - kube-reset
        - kube-smoke-test
        - kube-load-images
      failed_when: false

    - name: Run kube-setup (installs kubeadm, kubelet, containerd, helm, cilium-cli)
      shell: /usr/local/bin/kube-setup
      args:
        creates: /usr/bin/kubeadm
      async: "{{ kube_setup_timeout }}"
      poll: 20
      register: kube_setup_result

    - name: Verify kubeadm present
      command: which kubeadm
      changed_when: false

    - name: Write golden-ready marker
      copy:
        dest: /var/lib/cloud/instance/kube-golden-ready
        content: "ready {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"
