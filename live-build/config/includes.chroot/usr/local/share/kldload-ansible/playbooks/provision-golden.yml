---
# Runs against a freshly booted cloud image VM. Does the work that used to
# sit inside cloud-init runcmd — which was unreliable across distros.
#
# Preconditions (handled by minimal cloud-init):
#   - SSH is up, root password is kldload, PermitRootLogin yes
#   - Host has DHCP
#
# After this play: kube-setup has run, firewalld is off, /tmp/kube-golden-ready
# exists. The caller (kube-cluster) then seals the image.

- name: Provision kldload golden VM
  hosts: all
  become: true
  gather_facts: true
  vars:
    kube_setup_timeout: 1500  # 25 min for package installs across slow mirrors

  tasks:
    - name: Detect distro family
      set_fact:
        is_deb: "{{ ansible_os_family == 'Debian' }}"
        is_rpm: "{{ ansible_os_family in ['RedHat', 'Rocky', 'AlmaLinux'] }}"

    - name: Disable firewalld (RPM)
      when: is_rpm
      systemd:
        name: firewalld
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Disable ufw (Debian/Ubuntu)
      when: is_deb
      systemd:
        name: ufw
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Ensure SSH hardening drop-in exists
      copy:
        dest: /etc/ssh/sshd_config.d/99-kldload.conf
        content: |
          PermitRootLogin yes
          PasswordAuthentication yes
          MaxStartups 20:30:60
        mode: "0644"

    - name: Reload sshd
      systemd:
        name: "{{ 'ssh' if is_deb else 'sshd' }}"
        state: reloaded
      failed_when: false

    # qemu-guest-agent is installed and enabled by kube-setup, from the host's
    # darksite. It was a `package` task here, which ran BEFORE kube-setup had
    # pointed the golden at the darksite, so on an offline host it stalled on
    # Fedora's mirrors; and its check read /usr/sbin/qemu-ga, where Fedora
    # does not put it (2026-09-27). kube-setup checks the binary on PATH.

    - name: Disable swap (Kubernetes requirement)
      shell: |
        swapoff -a || true
        sed -i.bak -E 's@^([^#].*\sswap\s.*)$@#\1@' /etc/fstab || true
      changed_when: false

    - name: Copy kube-* tools into the VM
      copy:
        src: "/usr/local/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
      loop:
        - kube-setup
        - kube-init
        - kube-join
        - kube-network
        - kube-status
        - kube-reset
        - kube-smoke-test
        - kube-load-images
      failed_when: false

    # k8s_minor comes from the HOST's k8s-stack.lock, passed in by
    # kube-cluster with -e. The guest has no copy of that lock — it lives on
    # the hypervisor — which is why this is handed over rather than read here.
    #
    # Empty means the caller had no lock to read, and kube-setup then keeps
    # its own default. That is the case that shipped v1.32 nodes from an image
    # whose lock said v1.37 (fiend 2026-09-20).
    - name: Run kube-setup (installs kubeadm, kubelet, containerd, helm, cilium-cli)
      shell: /usr/local/bin/kube-setup
      environment:
        K8S_VERSION: "{{ k8s_minor | default('') }}"
        # The host's darksite, tunnelled to the golden's 127.0.0.1 by
        # kube-cluster for the length of this play. Empty means install from
        # the internet (no bundle on the host, or the tunnel did not come up).
        KLDLOAD_DARKSITE_URL: "{{ darksite_url | default('') }}"
        # The host's address on the VM bridge; kube-cluster has made it serve
        # time. Empty leaves the distro's time servers in place.
        NTP_SERVER: "{{ ntp_server | default('') }}"
        # The cluster ranges from the host's network plan (kube-cluster passes
        # them): kube-setup bakes the pod and Service routes into the golden,
        # and the guest has no plan file of its own. Empty keeps kube-setup's
        # defaults.
        POD_CIDR: "{{ pod_cidr | default('10.244.0.0/16') }}"
        SVC_CIDR: "{{ svc_cidr | default('10.96.0.0/16') }}"
      args:
        creates: /usr/bin/kubeadm
      async: "{{ kube_setup_timeout }}"
      poll: 20
      register: kube_setup_result

    - name: Verify kubeadm present
      command: which kubeadm
      changed_when: false

    - name: Write golden-ready marker
      copy:
        dest: /var/lib/cloud/instance/kube-golden-ready
        content: "ready {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"
