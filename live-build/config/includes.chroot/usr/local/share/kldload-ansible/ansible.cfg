[defaults]
host_key_checking = False
stdout_callback = default
callback_result_format = yaml
deprecation_warnings = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
forks = 10
roles_path = /usr/local/share/kldload-ansible/roles
# Dynamic inventory from the kldload state DB — populated by VM lifecycle
# events. Falls back to the static file if the script is missing.
inventory = /usr/local/bin/kldload-inventory,/usr/local/share/kldload-ansible/inventory/hosts

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
