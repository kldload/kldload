[defaults]
# Host keys are not checked, deliberately: every host this inventory reaches
# is a kldload VM clone whose SSH host keys are regenerated at each seal and
# every re-clone, at an address the previous clone also had. accept-new with a
# persistent known_hosts would fail on the second clone of every golden; the
# hypervisor itself is reached by name, not through this inventory. Reviewed
# 2026-09-23; revisit if durable hosts are ever added here.
host_key_checking = False
stdout_callback = default
callback_result_format = yaml
deprecation_warnings = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
# 10 forks is ansible's cautious default and it means 45 hosts run in five
# waves — visibly slow on a fleet this size, for no reason: a ping is one SSH
# round trip and the box has 24 threads. 32 covers the demo fleet in one wave
# and stays well under the file-descriptor and SSH-session limits. The UI's
# forks box still overrides per run.
forks = 32
roles_path = /usr/local/share/kldload-ansible/roles
# The estate's own key, and root as the default login.
#
# Every guest kldload enrolls gets root's public key pushed into it — that is
# what kfire and `vmx --enroll` use to reach it. Ansible pinned neither, so it
# used whatever key the INVOKING user happened to have: run as root it reached
# all 46 hosts, run as anyone else it reached none of them and reported a
# single success (localhost answering itself). The tool should address the
# estate the same way whoever runs it (fiend, 2026-09-06).
#
# ansible_user / ansible_ssh_private_key_file on a host in the inventory still
# win over these, which is how a guest with its own login stays reachable.
remote_user = root
private_key_file = /root/.ssh/id_ed25519
# Dynamic inventory from the kldload state DB — populated by VM lifecycle
# events. Falls back to the static file if the script is missing.
inventory = /usr/local/bin/kldload-inventory,/usr/local/share/kldload-ansible/inventory/hosts

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
