apiVersion: v2
name: pod-inspector
description: |
  A workload you can SEE working: every replica serves a page naming the pod
  and the node it landed on, so a browser refresh proves the Service is load
  balancing and a `kubectl drain` proves rescheduling — live, on camera.

  This is the end-to-end drop-in example. Package it, put the .tgz in
  /root/darksite/helm-charts/workloads/, and it is running when the machine
  finishes its first boot, with no registry to reach and no pipeline.

  For the bare scaffold to copy into a chart of your own, see
  ../../helm/hello-world instead — this one is deliberately fuller.
type: application
version: 1.0.0
appVersion: "1.27-alpine"
keywords: [kldload, example, workload, drop-in, nginx]
home: https://kldload.com
maintainers:
  - name: kldload
    url: https://kldload.com
