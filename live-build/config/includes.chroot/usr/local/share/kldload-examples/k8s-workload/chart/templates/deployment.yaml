{{- /*
One Deployment. The only unusual part is the start command: it substitutes the
pod and node names into the page before handing off to nginx, so each replica
serves a page that identifies itself. exec keeps nginx as PID 1 so signals and
graceful shutdown still work.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
{{ include "pod-inspector.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{ include "pod-inspector.selector" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "pod-inspector.labels" . | indent 8 }}
      annotations:
        # Roll the pods when the page changes, so `helm upgrade --set message=`
        # takes effect immediately instead of on the next unrelated restart.
        checksum/page: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
{{ include "pod-inspector.selector" . | indent 14 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s/__POD__/${POD_NAME}/g" -e "s/__NODE__/${NODE_NAME}/g" \
                  /page/index.html > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: page
              mountPath: /page
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}-page
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- end }}
