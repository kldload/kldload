# cronjob-loadgen.yaml — k6 every minute, no PVC, results to stdout
# (so Loki promtail picks them up under {job="kldload-app"}).
#
# Edit TARGET env var to point at any HTTP endpoint reachable from the
# cluster. Defaults to the kldload-shipped petclinic ingress VIP.
---
apiVersion: v1
kind: Namespace
metadata: { name: examples }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: k6-loadgen, namespace: examples }
spec:
  schedule: "* * * * *"   # every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: k6
              image: grafana/k6:0.52.0
              env:
                - { name: TARGET, value: "http://10.100.10.30/" }   # petclinic VIP default
              command:
                - /bin/sh
                - -c
                - |
                  cat > /tmp/run.js <<'EOF'
                  import http from 'k6/http';
                  export const options = {
                    scenarios: {
                      steady: {
                        executor: 'constant-arrival-rate',
                        rate: 50, timeUnit: '1s',
                        duration: '30s',
                        preAllocatedVUs: 50, maxVUs: 200,
                      },
                    },
                  };
                  export default function () { http.get(__ENV.TARGET); }
                  EOF
                  k6 run /tmp/run.js
