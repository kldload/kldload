# 01-sanoid-template.conf — drop-in sanoid retention template.
#
# Copy to /etc/sanoid/sanoid.d/<your-app>.conf, then edit the dataset
# selector at the bottom to point at the dataset(s) you want covered.
#
# Sanoid runs from /etc/cron.d/sanoid every minute and applies the
# template's retention math to every matching dataset.

# ── Template ──────────────────────────────────────────────────────────
# Three retention curves:
#   * frequent — short, dense (gives you the fine-grained rollback story)
#   * hourly + daily — the production curve (last 2 days hour-by-hour,
#                       last 90 days day-by-day)
#   * weekly + monthly — long-tail archive (last year of mondays + last
#                       12 months of month-starts)
[template_kldload-standard]
        # Frequents: every frequent_period minutes, keep this many
        frequently      = 12
        frequent_period = 5      # → 12 snapshots × 5 min = 1 hour of fine-grain rollback
        # Hourly + Daily — the "I know what time the problem started" coverage
        hourly          = 48     # last 48 hours
        daily           = 90     # last 90 days
        # Weekly + Monthly — long retention; small disk cost (deltas only)
        weekly          = 12     # last 12 weeks
        monthly         = 12     # last 12 months
        yearly          = 0      # not used; flip to non-zero for multi-year retention

        autosnap        = yes    # actually create snapshots (not just prune)
        autoprune       = yes    # actually delete expired ones

# ── Dataset selector(s) ───────────────────────────────────────────────
# Add one [dataset/path] block per dataset you want covered. Use
# `recursive = yes` to apply to children too (e.g., zone all of
# rpool/postgres with one entry).
#
# Examples below — uncomment + adjust to your tree:

# Single dataset, non-recursive
#[rpool/myapp/data]
#       use_template = kldload-standard
#       recursive    = no

# Whole tree, recursive — every child gets the policy
#[rpool/projects]
#       use_template = kldload-standard
#       recursive    = yes

# Process-control flags (rarely needed):
#       process_children_only = yes   # don't snapshot the parent itself
#       autosnap = no                 # OBSERVE the dataset (in case template
#                                       changes) without taking snapshots —
#                                       useful for "monitored but managed elsewhere"
