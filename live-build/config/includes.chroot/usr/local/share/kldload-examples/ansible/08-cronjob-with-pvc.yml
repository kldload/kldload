---
# 08-cronjob-with-pvc — k6 load generator CronJob writing results to a
# ZFS-backed PVC. Reusable pattern for any periodic batch workload
# (backups, ETL, scheduled scans).
#
# k6 fires every minute, 50 RPS for 30s against a configurable target,
# writes a JSON summary into the PVC. Use `kubectl exec` into a debug
# pod that mounts the same PVC to inspect results.

- name: cronjob-with-pvc — k6 loadgen pattern, results persisted to ZFS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    namespace: examples
    cronjob_name: loadgen
    target_url: "http://nginx-app.examples.svc.cluster.local"
    rps: 50
    duration: 30s
    schedule: "* * * * *"   # every minute
    k6_image: "grafana/k6:0.52.0"

  tasks:
    - name: Namespace
      kubernetes.core.k8s:
        state: present
        definition: { apiVersion: v1, kind: Namespace, metadata: { name: "{{ namespace }}" } }

    - name: Results PVC (ZFS-backed)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: { name: "{{ cronjob_name }}-results", namespace: "{{ namespace }}" }
          spec:
            accessModes: [ReadWriteMany]   # multiple jobs may write concurrently
            resources: { requests: { storage: 500Mi } }

    - name: k6 script ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: "{{ cronjob_name }}-script", namespace: "{{ namespace }}" }
          data:
            run.js: |
              import http from 'k6/http';
              export const options = {
                scenarios: {
                  steady: {
                    executor: 'constant-arrival-rate',
                    rate: {{ rps }}, timeUnit: '1s',
                    duration: '{{ duration }}',
                    preAllocatedVUs: 50, maxVUs: 200,
                  },
                },
              };
              export default function () { http.get(__ENV.TARGET); }
              export function handleSummary(data) {
                const ts = new Date().toISOString().replace(/[:.]/g, '-');
                return { ['/results/run-' + ts + '.json']: JSON.stringify(data, null, 2) };
              }

    - name: CronJob
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata: { name: "{{ cronjob_name }}", namespace: "{{ namespace }}" }
          spec:
            schedule: "{{ schedule }}"
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 1
            jobTemplate:
              spec:
                ttlSecondsAfterFinished: 120
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: k6
                        image: "{{ k6_image }}"
                        args: [run, /scripts/run.js]
                        env: [{ name: TARGET, value: "{{ target_url }}" }]
                        volumeMounts:
                          - { name: script,  mountPath: /scripts }
                          - { name: results, mountPath: /results }
                    volumes:
                      - name: script
                        configMap: { name: "{{ cronjob_name }}-script" }
                      - name: results
                        persistentVolumeClaim: { claimName: "{{ cronjob_name }}-results" }

    - debug:
        msg: |
          CronJob {{ cronjob_name }} scheduled. First run in ≤1 minute.
          Inspect results:
            kubectl run -n {{ namespace }} debug --rm -it --image=alpine \
              --overrides='{"spec":{"volumes":[{"name":"r","persistentVolumeClaim":{"claimName":"{{ cronjob_name }}-results"}}],"containers":[{"name":"d","image":"alpine","command":["sh"],"stdin":true,"tty":true,"volumeMounts":[{"name":"r","mountPath":"/results"}]}]}}'
