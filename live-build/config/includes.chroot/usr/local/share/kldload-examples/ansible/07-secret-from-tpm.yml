---
# 07-secret-from-tpm — read a TPM-sealed secret from /var/lib/kldload/
# and project it into the cluster as a Kubernetes Secret. Demonstrates
# the "no plaintext on disk" pattern: the secret only ever materialises
# in tmpfs (TPM unseal → bash variable → kubectl apply via stdin).
#
# Prerequisites: a TPM-sealed secret must exist on the host. To create
# one for testing:
#   echo "my-secret-value" | tpm-secret seal --name example-token

- name: secret-from-tpm — TPM unseal → K8s Secret without disk persistence
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    namespace: examples
    k8s_secret_name: example-token
    tpm_secret_name: example-token

  tasks:
    - name: Verify TPM-sealed secret exists on host
      stat:
        path: "/var/lib/kldload/secrets/{{ tpm_secret_name }}.tpm"
      register: tpm_blob

    - name: Fail if secret not sealed yet
      fail:
        msg: |
          No TPM-sealed secret named "{{ tpm_secret_name }}".
          Create one with:  echo "value" | tpm-secret seal --name {{ tpm_secret_name }}
      when: not tpm_blob.stat.exists

    - name: Unseal the secret into a bash variable (tmpfs only, no disk write)
      shell: |
        tpm-secret unseal --name {{ tpm_secret_name }}
      register: unseal
      no_log: true   # don't log the plaintext

    - name: Namespace
      kubernetes.core.k8s:
        state: present
        definition: { apiVersion: v1, kind: Namespace, metadata: { name: "{{ namespace }}" } }

    - name: Project as K8s Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ k8s_secret_name }}"
            namespace: "{{ namespace }}"
            annotations:
              kldload.io/source: "tpm-sealed"
              kldload.io/tpm-secret-name: "{{ tpm_secret_name }}"
          type: Opaque
          stringData:
            value: "{{ unseal.stdout }}"
      no_log: true

    - debug:
        msg: |
          Secret {{ namespace }}/{{ k8s_secret_name }} projected from TPM blob.
          Plaintext never touched disk between unseal and apply.
          Reference from a pod via: { secretKeyRef: { name: {{ k8s_secret_name }}, key: value } }
