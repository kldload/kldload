# ---------------------------------------------------------------------------
# values.yaml — the full-stack demo's knobs.
#
# Sized for a 3-worker kldload cluster (4 vCPU + 8 GB RAM per worker). Every
# tag is pinned so a redeploy is a deliberate version bump, not a silent
# base-image change under you.
#
# HISTORY: build #46 had to gut this chart because it depended on
# springcommunity/spring-petclinic-*:3.1.0, and those tags were removed from
# Docker Hub. Every fresh install then hit ImagePullBackOff on the whole
# application tier, and the demo was cut back to Postgres plus a contentless
# nginx that served 404 on every path.
#
# The fix was not a different third-party image, it was owning the image:
# `kube-demo-image` builds the app from this repo and imports it into
# containerd on every node. That is why app.image.pullPolicy is Never — the
# image is placed on the node deliberately, and a missing image should fail
# loudly and immediately rather than silently reaching for a registry that may
# not be reachable.
# ---------------------------------------------------------------------------
global:
  namespace: demo
  imagePullPolicy: IfNotPresent
  # Empty = the cluster default StorageClass (kldload sets local-path on a
  # ZFS-backed dataset, which is what makes the snapshot/rollback demo real).
  storageClass: ""

# ── The application ─────────────────────────────────────────────────────────
app:
  image:
    repository: localhost/kldload-demo
    # Never: this image is imported node-side by kube-demo-image. Pulling would
    # reach for a registry that does not have it, turning a clear "image
    # missing" into a slow, confusing ImagePullBackOff.
    pullPolicy: Never
  replicas: 3
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }

  # The two tracks. Both are always deployed; `activeTrack` decides which one
  # the public VIP points at. The tag is what actually differs between them in
  # a real rollout — here both run the same image with a different version
  # string and theme, so the cutover is visible without needing two builds.
  blue:
    enabled: true
    tag: "1.0.0"
    version: "1.0.0"
  green:
    enabled: true
    tag: "1.0.0"
    version: "2.0.0"

# Which track the public Service sends traffic to. Flipping this value and
# running `helm upgrade` IS the cutover; `kube-bluegreen` does exactly that and
# nothing more, because a blue/green switch should be one label change and not
# a bespoke mechanism.
activeTrack: blue

# ── Postgres ────────────────────────────────────────────────────────────────
# Shared by both tracks on purpose: the demo's whole argument is that a cutover
# swaps the application without disturbing the data underneath it.
postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  storageSize: 5Gi
  database: shop
  credentials:
    user: shop
    # Demo credential, and it is in git on purpose so the chart installs with no
    # prerequisites. Override for anything reachable from a real network:
    #   --set postgres.credentials.password=<your-password>
    password: kldload-demo-2026
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 1000m, memory: 768Mi }

# ── Public edge ─────────────────────────────────────────────────────────────
# nginx in front of the app: security headers, per-IP rate limiting, gzip, and
# a stable public address that a blue/green cutover never moves.
web:
  replicas: 2
  image:
    repository: nginx
    tag: "1.27-alpine"
  # Generous enough that a demo audience refreshing hard never trips it, low
  # enough that it is a real limit rather than decoration.
  # Cluster DNS address. nginx's resolver takes an IP, never a name. 10.96.0.10
  # is the kubeadm default (the .10 of the service CIDR); kube-demo detects the
  # live value and overrides this, so a non-default service CIDR still works.
  dnsResolver: "10.96.0.10"
  rateLimit: 50r/s
  rateLimitBurst: 100
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 300m, memory: 128Mi }

# ── Public VIP ──────────────────────────────────────────────────────────────
# The address the browser talks to. It lands on the `web` proxy, which is why
# it stays put across a cutover.
service:
  type: LoadBalancer
  port: 80
  # Left empty so MetalLB assigns from its configured pool. Hardcoding an
  # address here is how the old demo ended up telling operators to curl
  # 10.100.10.30 while MetalLB had actually handed out 192.168.122.201.
  loadBalancerIP: ""

# ── Load generator ──────────────────────────────────────────────────────────
# Runs continuously against the VIP so a cutover can be shown to drop zero
# requests. That is the claim blue/green exists to make, so the demo should
# measure it rather than assert it.
loadgen:
  enabled: true
  image:
    repository: grafana/k6
    tag: "0.52.0"
  vus: 5
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 192Mi }

observability:
  scrape: true
  prometheusPath: /metrics
  prometheusPort: 8080
