# javaapi-fullstack — values.yaml
#
# Defaults tuned for a single-host klab cluster (1 CP + 3 workers, ~4
# CPU + 8 GB RAM per worker). Every image tag is pinned to a specific
# version — no `:latest` anywhere — so a chart upgrade is a deliberate
# version-bump, not a silent base-image change.
#
# Build #46 rewrite: dropped the seven Spring Petclinic services that
# referenced springcommunity/spring-petclinic-*:3.1.0 images. Those
# tags don't exist on Docker Hub (404 on every pull), so every fresh
# install hit ImagePullBackOff on the entire microservices tier. The
# rollback story doesn't depend on the Spring tier — it's
# Postgres + ZFS snapshots — so the chart is now a minimal verified-
# working stack: Postgres on a PVC + nginx as the public face + k6
# loadgen. All three images exist, all three pull cleanly. The
# "Christmas tree" topology demo is restored in build #47+ when we
# replace the Spring tier with images that actually exist (Sock Shop
# or Online Boutique — both proven public).

# ── Global ──────────────────────────────────────────────────────────
global:
  namespace: demo
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent
  storageClass: ""  # empty = cluster default (kldload sets local-path
                    # as the default on klab clusters via kube-init
                    # install_local_path_provisioner)

# ── PostgreSQL ──────────────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  storageSize: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  credentials:
    user: petclinic
    database: petclinic
    # NOT a secret in any real sense — published in the demo README.
    # The Postgres service is ClusterIP-only; never reachable from
    # outside the cluster. Override for any non-demo install:
    #   --set postgres.credentials.password=<your-password>
    password: petclinic-demo-2026

# ── Public web tier — nginx, MetalLB-exposed ─────────────────────────
web:
  enabled: true
  replicas: 3
  image:
    repository: nginx
    tag: 1.27-alpine
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 64Mi }
  service:
    # Type LoadBalancer + MetalLB annotation. The pool name is the
    # kube-cluster bootstrap default ("default-pool"); override at
    # install time if a different pool is configured.
    type: LoadBalancer
    # No address-pool annotation: MetalLB assigns from any autoAssign pool, so
    # the demo works whatever the operator named theirs. Naming one that does
    # not exist makes MetalLB decline the allocation and the Service never
    # leaves <pending> — set it here only if you have a specific pool.

# ── Load generator — k6 CronJob ──────────────────────────────────────
# Runs every minute, 50 RPS for 30s against the web service ClusterIP.
# Idempotent, no destructive operations. Stdout goes to Loki via the
# {job="kldload-app"} promtail target.
loadgen:
  enabled: true
  image:
    repository: grafana/k6
    tag: 0.52.0
  schedule: "* * * * *"
  rps: 50
  durationSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 128Mi }

# ── Observability annotations propagated to every pod ────────────────
observability:
  scrape: true
  prometheusPort: 8080
  prometheusPath: /metrics
