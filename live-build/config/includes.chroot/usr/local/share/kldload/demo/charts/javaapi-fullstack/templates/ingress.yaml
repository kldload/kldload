{{- if .Values.web.enabled }}
# Public web tier — nginx, MetalLB-exposed. Build #46 rewrite: dropped
# the api-gateway / admin-server proxy paths since those services no
# longer exist in the simplified chart. nginx now serves a static
# kldload-demo landing page and a /healthz endpoint. The MetalLB-
# allocated IP appears in `kubectl -n demo get svc web` after a few
# seconds; the loadBalancerIP is NOT hardcoded (build #44 lesson:
# hardcoded LAN IPs don't match whatever pool kube-cluster sets up).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html><head><title>kldload demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 4em auto; padding: 0 1em; color: #c0c0d0; background: #0f1117 }
      h1 { color: #34d399 }
      a { color: #60a5fa }
      code { background: #1a1d28; padding: 0.2em 0.4em; border-radius: 3px; color: #f4f4f5 }
    </style>
    </head><body>
      <h1>kldload demo workload</h1>
      <p>This is the kldload 1.0 demo workload. nginx + Postgres + k6
         loadgen, deployed via <code>kube-demo javaapi</code>. If you
         can read this, the deployment is live and every kldload
         dashboard should show non-zero activity.</p>
      <p>k6 is firing 50 RPS at this page continuously. Watch the
         Hubble Live Topology dashboard in Grafana &mdash; every
         request shows up as a flow within seconds.</p>
      <p><em>Run <code>kube-demo javaapi_disaster</code> to drop a
         table, then <code>kube-demo javaapi_recover</code> to roll
         back via ZFS. TTR should be under 60 seconds.</em></p>
    </body></html>
  default.conf: |
    server {
      listen 80 default_server;
      access_log /dev/stdout main;
      error_log  /dev/stderr;
      location = /        { root /usr/share/nginx/html; index index.html; }
      location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: web
    kldload.io/component: edge
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "javaapi.selectorLabels" . | nindent 6 }}
      app: web
  template:
    metadata:
      labels:
        {{- include "javaapi.commonLabels" . | nindent 8 }}
        app: web
        kldload.io/component: edge
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: content, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes:
        - name: content
          configMap:
            name: web-content
            items:
              - { key: index.html, path: index.html }
              - { key: default.conf, path: default.conf }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    kldload.io/app: "true"
  annotations: {{- toYaml .Values.web.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "javaapi.selectorLabels" . | nindent 4 }}
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
