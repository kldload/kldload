# All seven Spring services in one file. Each calls the
# `javaapi.springDeployment` and `javaapi.springService` helpers
# from _helpers.tpl with service-specific values. Keeping them in one
# template keeps the chart's manifest count low (Argo's UI gets noisy
# when there are too many top-level resources).
#
# Render order matters for first-boot:
#   1. config-server     (Spring Cloud Config — every other service reads from it)
#   2. discovery-server  (Eureka — services register here)
#   3. customers/vets/visits (domain services — depend on config + discovery)
#   4. api-gateway       (routes /api/* to the domain services)
#   5. admin-server      (UI for live JMX inspection — non-critical)
#
# Argo doesn't enforce ordering — it applies everything in parallel.
# Each Spring service has its own retry/restart logic via Spring Cloud
# Config retry + Eureka client reconnect, so the eventual-consistency
# wins. By steady state (~90s after sync) every pod is Ready.

{{- if .Values.configServer.enabled }}
---
{{- include "javaapi.springDeployment" (dict "ctx" . "name" "config-server"
    "component" "platform"
    "image" (printf "%s:%s" .Values.configServer.image.repository .Values.configServer.image.tag)
    "resources" .Values.configServer.resources
    "extraEnv" (list
      (dict "name" "SPRING_PROFILES_ACTIVE" "value" "kubernetes")
    )) }}
---
{{- include "javaapi.springService" (dict "ctx" . "name" "config-server") }}
{{- end }}

{{- if .Values.discoveryServer.enabled }}
---
{{- include "javaapi.springDeployment" (dict "ctx" . "name" "discovery-server"
    "component" "platform"
    "image" (printf "%s:%s" .Values.discoveryServer.image.repository .Values.discoveryServer.image.tag)
    "resources" .Values.discoveryServer.resources
    "extraEnv" (list
      (dict "name" "SPRING_PROFILES_ACTIVE" "value" "kubernetes")
      (dict "name" "CONFIG_SERVER_URL"      "value" "http://config-server:8080")
    )) }}
---
{{- include "javaapi.springService" (dict "ctx" . "name" "discovery-server") }}
{{- end }}

{{- if .Values.customersService.enabled }}
---
{{- include "javaapi.springDeployment" (dict "ctx" . "name" "customers-service"
    "component" "domain"
    "image" (printf "%s:%s" .Values.customersService.image.repository .Values.customersService.image.tag)
    "replicas" .Values.customersService.replicas
    "resources" .Values.customersService.resources
    "extraEnv" (list
      (dict "name" "SPRING_PROFILES_ACTIVE"   "value" "kubernetes,postgres")
      (dict "name" "CONFIG_SERVER_URL"        "value" "http://config-server:8080")
      (dict "name" "DISCOVERY_SERVER_URL"     "value" "http://discovery-server:8080/eureka")
      (dict "name" "SPRING_DATASOURCE_URL"
            "value" (printf "jdbc:postgresql://postgres.%s.svc.cluster.local:5432/petclinic" .Values.global.namespace))
      (dict "name" "SPRING_DATASOURCE_USERNAME" "value" .Values.postgres.credentials.user)
      (dict "name" "SPRING_DATASOURCE_PASSWORD"
            "valueFrom" (dict "secretKeyRef" (dict "name" "postgres-credentials" "key" "postgres-password")))
    )) }}
---
{{- include "javaapi.springService" (dict "ctx" . "name" "customers-service") }}
{{- end }}

