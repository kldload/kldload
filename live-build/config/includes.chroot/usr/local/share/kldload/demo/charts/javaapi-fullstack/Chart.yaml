apiVersion: v2
name: javaapi-fullstack
description: |
  Spring PetClinic Microservices — the kldload 1.0 "Christmas tree" demo
  workload. Deploys 7 Spring Boot services + Postgres + nginx ingress + k6
  loadgen as one cohesive stack, behind a single MetalLB VIP.

  Designed to light up every dashboard on a kldload install (block I/O,
  TCP_INFO, Hubble L4/L7, Tetragon EXEC, ZFS txg/ARC, Cilium service map,
  Prometheus scrape, Loki log ingest). The stateful tier (Postgres) sits
  on a ZFS-tuned PVC so the rollback-recovery demo works end-to-end.

  Managed by Argo CD — every change is reconciled continuously, drift
  visible in the Argo UI at https://argo.<vip>/.

type: application
version: 1.0.0
appVersion: "3.1.0"

home: https://github.com/kldload/kldload
sources:
  - https://github.com/spring-petclinic/spring-petclinic-microservices
  - https://github.com/kldload/kldload/tree/main/live-build/config/includes.chroot/root/demo/charts/javaapi-fullstack

keywords:
  - kldload
  - demo
  - javaapi
  - spring
  - microservices
  - postgres
  - zfs

maintainers:
  - name: kldload
    url: https://kldload.com

annotations:
  # Marks this chart as part of the kldload 1.0 demo bundle. The webui
  # Demo Mode view filters Argo Applications by this annotation so the
  # presenter view only shows demo workloads, not operator workloads
  # an admin may have deployed alongside.
  kldload.io/demo: "javaapi-fullstack"
  kldload.io/version: "1.0"
