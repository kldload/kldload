apiVersion: v2
name: javaapi-fullstack
description: |
  The kldload full-stack demo: a storefront application with a real schema,
  real seeded data, a real write path, and blue/green deployment built in.

  Deploys Postgres on a ZFS-tuned PVC, two independently versioned copies of
  the application (the blue and green tracks), a MetalLB VIP whose selector is
  the cutover switch, and a k6 load generator that proves the cutover drops no
  requests.

  The application image is built by kldload itself (kube-demo-image) and
  imported straight into containerd on every node, so the demo works with the
  network unplugged. Nothing here pulls a third-party application image.

  Managed by Argo CD — drift is reconciled continuously and visible in the Argo
  UI at https://argo.<vip>/.

type: application
version: 2.0.0
appVersion: "2.0.0"

home: https://github.com/kldload/kldload
sources:
  - https://github.com/kldload/kldload

keywords:
  - kldload
  - demo
  - bluegreen
  - postgres
  - zfs

maintainers:
  - name: kldload
    url: https://kldload.com

annotations:
  # The webui Demo Mode view filters Argo Applications on this annotation so the
  # presenter view shows only demo workloads. The VALUE is load-bearing and must
  # stay in step with the label in _helpers.tpl and the webui's filter.
  kldload.io/demo: "javaapi-fullstack"
  kldload.io/version: "2.0"
