# ---------------------------------------------------------------------------
# web.yaml — the public edge: nginx as a reverse proxy in front of the app.
#
# What it does:
#   1. Terminates every public request and forwards it to the `shop` Service.
#   2. Adds the security headers the app should not be in the business of
#      setting itself.
#   3. Rate-limits per client IP so one browser cannot saturate the app tier.
#   4. Serves its own /healthz so the LoadBalancer can tell "proxy is up" from
#      "the application behind it is down".
#
# WHY a separate tier rather than exposing the app directly: the public VIP
# stays on this Deployment permanently, so a blue/green cutover never moves the
# address people have open in a browser. The switch happens one hop inside, at
# the `shop` Service. It also means the app process is not the thing absorbing
# abuse from the open network, which is the entire argument for a proxy.
#
# The upstream is referenced through a variable, with an explicit resolver.
# A literal hostname makes nginx resolve at STARTUP and abort if the name is not
# yet resolvable, so the edge would CrashLoop whenever it happened to start
# before the app Service existed. `nginx -t` catches this on an empty machine,
# which is how it was found here rather than in front of an audience.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
data:
  default.conf: |
    # Per-IP rate limit. conf.d is included inside http{}, which is the only
    # context where limit_req_zone is legal.
    limit_req_zone $binary_remote_addr zone=perip:10m rate={{ .Values.web.rateLimit }};

    # Cluster DNS, by IP because nginx's resolver directive takes addresses only.
    # valid=5s keeps a cutover from being masked by a stale cached record.
    resolver {{ .Values.web.dnsResolver }} valid=5s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        access_log /dev/stdout;
        error_log  /dev/stderr warn;

        # Never advertise the exact nginx build to the open network.
        server_tokens off;

        # Security headers. The app sets none of these by design: they are a
        # property of how the site is exposed, not of what it computes.
        add_header X-Frame-Options            "SAMEORIGIN"      always;
        add_header X-Content-Type-Options     "nosniff"         always;
        add_header Referrer-Policy            "same-origin"     always;
        add_header X-XSS-Protection           "1; mode=block"   always;
        add_header Content-Security-Policy    "default-src 'self'" always;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json;
        gzip_min_length 512;

        client_max_body_size 1m;

        # The proxy's own liveness. Deliberately does NOT touch the app: this
        # answers "is the edge up", and conflating it with app health makes an
        # app outage look like a proxy outage to whatever watches the VIP.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            limit_req zone=perip burst={{ .Values.web.rateLimitBurst }} nodelay;

            # The upstream goes through a VARIABLE deliberately. With a literal
            # hostname nginx resolves it at startup and REFUSES TO START if it
            # does not resolve yet -- so a proxy pod that comes up before the
            # app Service exists CrashLoops with "host not found in upstream"
            # instead of waiting. A variable defers resolution to request time,
            # which is what lets the edge start in any order.
            set $upstream "shop.{{ .Values.global.namespace }}.svc.cluster.local";
            proxy_pass http://$upstream:80;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Short timeouts: during a cutover the old endpoints disappear, and
            # a long connect timeout would turn a sub-second switch into a
            # visible stall in the browser.
            proxy_connect_timeout 2s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;

            # Retry the next endpoint if one is mid-termination. This is what
            # turns "zero dropped requests" from a hope into a mechanism.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: web
    kldload.io/component: edge
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "javaapi.selectorLabels" . | nindent 6 }}
      app: web
  template:
    metadata:
      labels:
        {{- include "javaapi.commonLabels" . | nindent 8 }}
        app: web
        kldload.io/component: edge
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: nginx
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: web
  annotations:
    kldload.io/role: "public entry point — this address does not move on cutover"
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP | quote }}
  {{- end }}
  externalTrafficPolicy: Cluster
  selector:
    {{- include "javaapi.selectorLabels" . | nindent 4 }}
    app: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 80
