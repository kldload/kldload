{{- if .Values.postgres.enabled }}
# Postgres 16 — the demo's stateful tier and the dataset the entire
# rollback story rotates around. Named `pvc-postgres-data` so the
# corresponding ZFS dataset (rpool/k8s/pvc-postgres-data via the
# kldload-default storage class's name templating) is trivial to find
# from the host:
#
#   zfs list -t snapshot rpool/k8s/pvc-postgres-data
#   zfs rollback rpool/k8s/pvc-postgres-data@autosnap_2026-05-21_14:30
#
# Sanoid policy (/etc/sanoid/sanoid.d/javaapi.conf) snapshots this
# dataset every 5 minutes. The `kldload-demo recover` script picks the
# most-recent pre-disaster snapshot automatically and re-mounts the
# pod against the rolled-back dataset.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.credentials.password | quote }}
  POSTGRES_USER:     {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_DB:       {{ .Values.postgres.credentials.database | quote }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-postgres-data
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    kldload.io/dataset-class: postgres
    kldload.io/snapshot-policy: javaapi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: postgres
    kldload.io/component: stateful-tier
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "javaapi.selectorLabels" . | nindent 6 }}
      app: postgres
  template:
    metadata:
      labels:
        {{- include "javaapi.commonLabels" . | nindent 8 }}
        app: postgres
        kldload.io/component: stateful-tier
      annotations:
        # Postgres-exporter isn't bundled (yet) — these annotations
        # are a no-op until kldload adds the postgres_exporter sidecar
        # in a future build. Harmless to leave.
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: POSTGRESQL_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRESQL_DATABASE
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: postgres-password } }
            # ZFS-friendly Postgres tuning. ZFS is COW + checksummed,
            # so full_page_writes (Postgres's torn-write protection)
            # is redundant — turning it off cuts write amplification
            # ~30% on update-heavy workloads. fsync stays ON because
            # ARC won't survive a kernel panic mid-batch.
            - name: POSTGRESQL_EXTRA_CONF
              value: |
                wal_compression = on
                full_page_writes = off
                synchronous_commit = on
                wal_init_zero = off
                wal_recycle = off
          ports:
            - name: postgres
              containerPort: 5432
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
          readinessProbe:
            exec:
              command: [bash, -c, "pg_isready -U petclinic -d petclinic -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [bash, -c, "pg_isready -U petclinic -d petclinic -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
spec:
  clusterIP: None    # headless — internal-only, never via MetalLB VIP
  selector:
    {{- include "javaapi.selectorLabels" . | nindent 4 }}
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
{{- end }}
