{{- if .Values.postgres.enabled }}
# Postgres 16 (official Alpine image) — the demo's stateful tier and
# the dataset the rollback story rotates around. Named pvc-postgres-data
# so the host-side ZFS dataset (the worker VM's zvol or local-path
# directory on the worker) is easy to find:
#
#   On the worker VM:
#     ls /opt/local-path-provisioner/*/pvc-postgres-data*
#
#   For the host-level rollback (the actual kldload pattern):
#     zfs snapshot rpool/vms/kldload-w-<n>@before-disaster
#     zfs rollback rpool/vms/kldload-w-<n>@before-disaster
#
# Sanoid policy (/etc/sanoid/sanoid.d/javaapi.conf) snapshots the
# WORKER VM's zvol every 5 minutes; that captures the PVC data
# transitively (the worker disk contains the local-path PVC dir).
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER:     {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_DB:       {{ .Values.postgres.credentials.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-postgres-data
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    kldload.io/dataset-class: postgres
    kldload.io/snapshot-policy: javaapi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: postgres
    kldload.io/component: stateful-tier
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "javaapi.selectorLabels" . | nindent 6 }}
      app: postgres
  template:
    metadata:
      labels:
        {{- include "javaapi.commonLabels" . | nindent 8 }}
        app: postgres
        kldload.io/component: stateful-tier
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - secretRef: { name: postgres-credentials }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, petclinic, -d, petclinic]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, petclinic, -d, petclinic]
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "javaapi.selectorLabels" . | nindent 4 }}
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
{{- end }}
