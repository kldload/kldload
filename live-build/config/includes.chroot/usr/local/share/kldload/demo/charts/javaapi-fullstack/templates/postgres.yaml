# ---------------------------------------------------------------------------
# postgres.yaml — the demo's stateful tier.
#
# A StatefulSet with one replica on a PVC, plus the schema mounted into
# /docker-entrypoint-initdb.d so a fresh volume comes up already seeded.
#
# WHY the initdb ConfigMap: the previous chart shipped Postgres with an empty
# data directory, so "full stack" was a database nothing had ever written to.
# Postgres runs everything in that directory exactly once — on a data dir that
# is empty — which is precisely the semantic wanted here: seed a new install,
# and never touch the data of an existing one. That is what makes the
# blue/green story true, because the data visibly outlives the app.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.credentials.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
data:
  # .Files.Get keeps the schema a real .sql file in the chart: it stays
  # syntax-highlighted, diffable and runnable by hand against a scratch
  # database, which a schema embedded in YAML never is.
  schema.sql: |
{{ .Files.Get "files/schema.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: postgres
spec:
  clusterIP: None          # headless: the StatefulSet wants stable DNS, not a VIP
  selector:
    {{- include "javaapi.selectorLabels" . | nindent 4 }}
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
    app: postgres
    kldload.io/component: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "javaapi.selectorLabels" . | nindent 6 }}
      app: postgres
  template:
    metadata:
      labels:
        {{- include "javaapi.commonLabels" . | nindent 8 }}
        app: postgres
        kldload.io/component: data
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.credentials.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # The image refuses to initdb into a non-empty mount point, and a
            # PVC arrives carrying lost+found. A subdirectory sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          # pg_isready over TCP, as the app connects, not a bare socket check:
          # a server still replaying WAL accepts a socket and refuses queries.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.credentials.user }}",
                        "-d", "{{ .Values.postgres.database }}", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.credentials.user }}",
                        "-d", "{{ .Values.postgres.database }}", "-h", "127.0.0.1"]
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 6
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "javaapi.commonLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
