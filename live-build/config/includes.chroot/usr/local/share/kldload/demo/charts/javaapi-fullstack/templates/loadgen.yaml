{{- if .Values.loadgen.enabled }}
# k6 load generator — fires {{ .Values.loadgen.rps }} RPS for
# {{ .Values.loadgen.durationSeconds }}s every minute against the
# in-cluster web service ClusterIP. Stdout streams to Loki via the
# kldload-app job label. Build #46 rewrite: target is now the
# simplified web service (was api-gateway from the dropped Spring
# tier).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loadgen
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "javaapi.commonLabels" . | nindent 4 }}
spec:
  schedule: {{ .Values.loadgen.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            {{- include "javaapi.commonLabels" . | nindent 12 }}
            app: loadgen
        spec:
          restartPolicy: Never
          containers:
            - name: k6
              image: "{{ .Values.loadgen.image.repository }}:{{ .Values.loadgen.image.tag }}"
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              env:
                - { name: TARGET, value: "http://web.{{ .Values.global.namespace }}.svc.cluster.local" }
              command: [sh, -c]
              args:
                - |
                  cat > /tmp/run.js <<'EOF'
                  import http from 'k6/http';
                  export const options = {
                    scenarios: {
                      steady: {
                        executor: 'constant-arrival-rate',
                        rate: {{ .Values.loadgen.rps }},
                        timeUnit: '1s',
                        duration: '{{ .Values.loadgen.durationSeconds }}s',
                        preAllocatedVUs: 50, maxVUs: 200,
                      },
                    },
                  };
                  export default function () { http.get(__ENV.TARGET); }
                  EOF
                  k6 run /tmp/run.js
              resources: {{- toYaml .Values.loadgen.resources | nindent 16 }}
{{- end }}
