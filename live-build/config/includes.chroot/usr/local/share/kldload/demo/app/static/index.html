<!doctype html>
<!--
  index.html — the demo storefront's single page.

  __TRACK__ and __VERSION__ are substituted by api.py at serve time. A static
  bundle cannot know which track its pod belongs to, and the whole point of the
  banner is to show WHICH replica answered, so the stamp has to happen per
  response rather than at build time.
-->
<html lang="en" data-track="__TRACK__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kldload Demo Storefront</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="banner">
  <div class="banner-id">
    <span class="dot"></span>
    <strong>kldload storefront</strong>
    <span class="track-pill">__TRACK__</span>
    <span class="version">v__VERSION__</span>
  </div>
  <div class="banner-served" id="served">serving from&hellip;</div>
</header>

<main>
  <section class="stats" id="stats" aria-label="Live totals"></section>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="products" role="tab">Products</button>
    <button class="tab" data-view="orders" role="tab">Orders</button>
    <button class="tab" data-view="order" role="tab">Place an order</button>
  </nav>

  <section class="panel" id="view-products">
    <div class="scroll"><table id="products">
      <thead><tr>
        <th>SKU</th><th>Name</th><th>Category</th>
        <th class="num">Price</th><th class="num">Stock</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section class="panel hidden" id="view-orders">
    <div class="scroll"><table id="orders">
      <thead><tr>
        <th class="num">#</th><th>Customer</th><th>City</th>
        <th>Status</th><th class="num">Items</th><th class="num">Total</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section class="panel hidden" id="view-order">
    <!--
      A write path, on purpose. A cutover that only preserves reads proves very
      little; an order placed against blue and still present after green takes
      over is the thing worth showing.
    -->
    <form id="order-form" class="order-form">
      <label>Customer
        <select name="customer_id" id="f-customer" required></select>
      </label>
      <label>Product
        <select name="product_id" id="f-product" required></select>
      </label>
      <label>Quantity
        <input type="number" name="quantity" id="f-qty" value="1" min="1" max="5" required>
      </label>
      <button type="submit">Place order</button>
    </form>
    <p class="result" id="order-result" role="status"></p>
  </section>
</main>

<footer>
  <span id="schema-note">schema&hellip;</span>
</footer>
<script src="/app.js"></script>
</body>
</html>
