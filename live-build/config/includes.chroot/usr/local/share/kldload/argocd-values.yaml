# ArgoCD helm values — kldload defaults
#
# Loaded by kldload-autodeploy at K8s bootstrap time (Phase 2 in
# /usr/sbin/kldload-autodeploy). Everything here can be re-applied by
# `helm upgrade argocd /root/darksite/helm-charts/argo-cd.tgz -n argocd
# -f /usr/local/share/kldload/argocd-values.yaml` without touching the
# autodeploy script.
#
# Sizing: targets a klab cluster of 1 CP + 3 workers (~4 vCPU / 8 GB
# per worker). Full Argo (server + repo-server + controller + dex +
# redis + notifications + applicationset) fits in ~1 GB RAM total.

global:
  # Image registry override available if you mirror inside an
  # air-gap. By default Argo pulls from quay.io which is reachable
  # from kldload installs.
  image:
    imagePullPolicy: IfNotPresent

# ── server (web UI + API) ─────────────────────────────────────────────
server:
  replicas: 1   # single replica for klab footprint — HA Argo (3
                # replicas + redis-ha) is a 1.1 concern not 1.0
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  service:
    # Exposed via MetalLB, from whichever pool MetalLB auto-assigns.
    #
    # WHY NO address-pool ANNOTATION: naming a pool here hardcodes an operator's
    # choice into a shipped file. This said `kldload-pool` while the cluster
    # bootstrap created `default-pool`, so MetalLB logged `unknown pool` and
    # refused to allocate — argocd-server sat at EXTERNAL-IP <pending> and
    # `helm install --wait` blocked for its whole 15-minute timeout with every
    # ArgoCD pod already Running (fiend, 2026-08-19). It looked like a frozen
    # installer and it was a spelling mismatch.
    #
    # Un-annotated, MetalLB assigns from any pool with autoAssign — which is
    # correct whatever the operator named theirs. kldload-autodeploy re-adds
    # the annotation ONLY when METALLB_POOL_NAME is explicitly set, so an
    # operator who wants a specific pool still gets one, and everyone else
    # gets an address instead of a stall.
    type: LoadBalancer
  ingress:
    # We do NOT use an ingress — MetalLB LB IP is enough. ingress
    # adds the nginx-controller dependency for what is otherwise a
    # 2-line config. If you front Argo with TLS via cert-manager
    # later, flip enabled: true and configure ingressClassName.
    enabled: false
  # Insecure mode = no self-signed TLS handshake confusion in the
  # iframe embed. nginx in front of Argo already does TLS via the
  # kldload-tls-cert pipeline. server.insecure also lives in
  # configs.params for parity (helm template order matters).
  extraArgs:
    - --insecure
  config:
    # Argo's CLI/UI banner. Helps presenter not confuse this with
    # a generic Argo install.
    banner: |
      kldload Demo Mode — full ArgoCD running on this kldload install.
      Default admin password: cat /var/lib/kldload/argocd-admin-password
    banner.permanent: "true"

configs:
  params:
    # Insecure server (matches extraArgs above). Argo's chart looks
    # for this key in two places depending on version; we set both
    # to avoid the "works in v2.10, broke in v2.11" footgun.
    server.insecure: true
  # CM data ConfigMap — controls dex / repo-server credentials /
  # sync-window defaults. Mostly defaults; only override what we need.
  cm:
    # Allow ANY repository (we point Argo at github.com/kldload/kldload
    # for the demo chart; further uses add more repos).
    repositories: |
      - url: https://github.com/kldload/kldload
        type: git
        name: kldload-self
    # Resource customizations — silence noisy CRD diff for cilium
    # which mutates status fields in ways Argo flags as drift.
    resource.customizations: |
      cilium.io/CiliumNetworkPolicy:
        ignoreDifferences: |
          jsonPointers:
            - /status
      cilium.io/CiliumEndpoint:
        ignoreDifferences: |
          jsonPointers:
            - /status

# ── repo-server (clones git repos for Argo Applications) ─────────────
repoServer:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ── application-controller (the reconciliation loop) ─────────────────
controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 1,    memory: 512Mi }

# ── dex (SSO) — off, because nothing here uses it ────────────────────
#
# WHY off: dex only does anything once an OIDC/SSO connector is configured
# in configs.cm (dex.config / oidc.config), and kldload configures none —
# Argo is reached with the local admin account. The pod was kept "for future
# SSO", and the cost of that was not zero: ArgoCD copies its own binary into
# the dex image and runs it there, and with argo-cd 10.3.3 (v3.5.1) against
# ghcr.io/dexidp/dex:v2.45.1 that binary dies on SIGSEGV (exit 139) the
# instant it starts, with no log output at all. It crash-looped 45 times in
# three hours and left the whole helm release in `failed` state, which is
# what kldload-doctor had been reporting as "helm/releases: 1/4 in bad
# state" (fiend, 2026-08-16).
#
# Turning it on again is this one line plus a connector under configs.cm —
# do both together, and pin a dex image that matches the Argo release.
dex:
  enabled: false

# ── redis (HA state cache) ─────────────────────────────────────────
redis:
  enabled: true
  resources:
    requests: { cpu: 10m,  memory: 32Mi }
    limits:   { cpu: 100m, memory: 96Mi }

# ── notifications-controller (Slack/email on sync events) ────────────
notifications:
  enabled: true
  resources:
    requests: { cpu: 10m,  memory: 32Mi }
    limits:   { cpu: 100m, memory: 96Mi }

# ── applicationset-controller (template multi-cluster apps) ──────────
# Useful when expanding to a multi-host kldload cluster fleet.
applicationSet:
  enabled: true
  resources:
    requests: { cpu: 10m,  memory: 32Mi }
    limits:   { cpu: 100m, memory: 96Mi }
