# kldload dnf boot-environment snapshot plugin — enable switch.
# Read by: dnf (loads /usr/lib/pythonX.Y/site-packages/dnf-plugins/kldload_be.py).
# Installed to: /etc/dnf/plugins/kldload_be.conf by kldload-firstboot.
# If missing or enabled=0, dnf runs with NO pre-transaction BE snapshot — a
# `dnf update` could then break the substrate with no labelled rollback point,
# so leave this enabled unless you are deliberately disabling the safety net.
[main]
enabled=1
