global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  # Host system metrics
  - job_name: 'klab-host'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          role: host

  # klab estate metrics (golden status, VM state, test results, ZFS pool)
  - job_name: 'klab-exporter'
    static_configs:
      - targets: ['localhost:9101']

  # Blue site VMs — scraped over WireGuard mesh (10.252.0.0/24)
  - job_name: 'klab-blue'
    static_configs:
      - targets:
          - '10.252.0.1:9100'
          - '10.252.0.2:9100'
          - '10.252.0.3:9100'
          - '10.252.0.4:9100'
          - '10.252.0.5:9100'
          - '10.252.0.6:9100'
        labels:
          site: blue
    relabel_configs:
      - source_labels: [__address__]
        regex: '10\.252\.0\.1:.*'
        target_label: distro
        replacement: centos
      - source_labels: [__address__]
        regex: '10\.252\.0\.2:.*'
        target_label: distro
        replacement: rocky
      - source_labels: [__address__]
        regex: '10\.252\.0\.3:.*'
        target_label: distro
        replacement: fedora
      - source_labels: [__address__]
        regex: '10\.252\.0\.4:.*'
        target_label: distro
        replacement: debian
      - source_labels: [__address__]
        regex: '10\.252\.0\.5:.*'
        target_label: distro
        replacement: ubuntu
      - source_labels: [__address__]
        regex: '10\.252\.0\.6:.*'
        target_label: distro
        replacement: rhel

  # Green site VMs — scraped over WireGuard mesh (10.253.0.0/24)
  - job_name: 'klab-green'
    static_configs:
      - targets:
          - '10.253.0.1:9100'
          - '10.253.0.2:9100'
          - '10.253.0.3:9100'
          - '10.253.0.4:9100'
          - '10.253.0.5:9100'
          - '10.253.0.6:9100'
        labels:
          site: green
    relabel_configs:
      - source_labels: [__address__]
        regex: '10\.253\.0\.1:.*'
        target_label: distro
        replacement: centos
      - source_labels: [__address__]
        regex: '10\.253\.0\.2:.*'
        target_label: distro
        replacement: rocky
      - source_labels: [__address__]
        regex: '10\.253\.0\.3:.*'
        target_label: distro
        replacement: fedora
      - source_labels: [__address__]
        regex: '10\.253\.0\.4:.*'
        target_label: distro
        replacement: debian
      - source_labels: [__address__]
        regex: '10\.253\.0\.5:.*'
        target_label: distro
        replacement: ubuntu
      - source_labels: [__address__]
        regex: '10\.253\.0\.6:.*'
        target_label: distro
        replacement: rhel
