global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Host system metrics
  - job_name: 'klab-host'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          role: host

  # klab estate metrics (golden status, VM state, test results, ZFS pool)
  - job_name: 'klab-exporter'
    static_configs:
      - targets: ['localhost:9101']

  # Blue site VMs — static IPs 192.168.122.101-106
  - job_name: 'klab-blue'
    static_configs:
      - targets:
          - '192.168.122.101:9100'
          - '192.168.122.102:9100'
          - '192.168.122.103:9100'
          - '192.168.122.104:9100'
          - '192.168.122.105:9100'
          - '192.168.122.106:9100'
        labels:
          site: blue
    relabel_configs:
      - source_labels: [__address__]
        regex: '192\.168\.122\.101:.*'
        target_label: distro
        replacement: centos
      - source_labels: [__address__]
        regex: '192\.168\.122\.102:.*'
        target_label: distro
        replacement: rocky
      - source_labels: [__address__]
        regex: '192\.168\.122\.103:.*'
        target_label: distro
        replacement: fedora
      - source_labels: [__address__]
        regex: '192\.168\.122\.104:.*'
        target_label: distro
        replacement: debian
      - source_labels: [__address__]
        regex: '192\.168\.122\.105:.*'
        target_label: distro
        replacement: ubuntu
      - source_labels: [__address__]
        regex: '192\.168\.122\.106:.*'
        target_label: distro
        replacement: rhel

  # Green site VMs — static IPs 192.168.122.201-206
  - job_name: 'klab-green'
    static_configs:
      - targets:
          - '192.168.122.201:9100'
          - '192.168.122.202:9100'
          - '192.168.122.203:9100'
          - '192.168.122.204:9100'
          - '192.168.122.205:9100'
          - '192.168.122.206:9100'
        labels:
          site: green
    relabel_configs:
      - source_labels: [__address__]
        regex: '192\.168\.122\.201:.*'
        target_label: distro
        replacement: centos
      - source_labels: [__address__]
        regex: '192\.168\.122\.202:.*'
        target_label: distro
        replacement: rocky
      - source_labels: [__address__]
        regex: '192\.168\.122\.203:.*'
        target_label: distro
        replacement: fedora
      - source_labels: [__address__]
        regex: '192\.168\.122\.204:.*'
        target_label: distro
        replacement: debian
      - source_labels: [__address__]
        regex: '192\.168\.122\.205:.*'
        target_label: distro
        replacement: ubuntu
      - source_labels: [__address__]
        regex: '192\.168\.122\.206:.*'
        target_label: distro
        replacement: rhel
