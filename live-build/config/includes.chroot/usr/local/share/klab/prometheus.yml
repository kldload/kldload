global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Zero hardcoded IPs. All dynamic target sets live in /etc/prometheus/targets/
# as JSON, populated by klab-prom-targets (systemd timer, runs every 30s).
# Prometheus file_sd watches the directory for changes — new VMs, new K8s
# nodes, DHCP re-lease, scale events all reflect without reload/restart.
#
# Generators (klab-prom-targets writes these):
#   targets/klab-blue.json           — klab blue-site VMs
#   targets/klab-green.json          — klab green-site VMs
#   targets/klab-kspawn.json         — any cluster spawned via kspawn
#   targets/cilium-agent.json        — cilium metrics per K8s node (9962)
#   targets/cilium-operator.json     — cilium-operator hostPort (9963)
#   targets/hubble-metrics.json      — hubble flow metrics (9965)
#   targets/tetragon.json            — tetragon syscall metrics (2112)
#   targets/kubelet.json             — kubelet metrics (10250)
#
# To add a new target type, extend klab-prom-targets to write one more
# JSON file. No edits to this YAML needed.

scrape_configs:
  # Host system metrics (localhost — the one IP that can't lie)
  - job_name: klab-host
    static_configs:
      - targets: ['localhost:9100']
        labels:
          role: host

  # klab estate metrics (golden status, VM state, test results, ZFS pool)
  - job_name: klab-exporter
    static_configs:
      - targets: ['localhost:9101']

  # ── klab VMs (blue/green/kspawn) ────────────────────────────────────────
  # Each target file carries per-VM labels (site, distro, cluster, name)
  # that klab-prom-targets synthesizes from `virsh` + klab state DB.
  - job_name: klab-blue
    file_sd_configs:
      - files: ['/etc/prometheus/targets/klab-blue.json']
        refresh_interval: 30s
  - job_name: klab-green
    file_sd_configs:
      - files: ['/etc/prometheus/targets/klab-green.json']
        refresh_interval: 30s
  - job_name: klab-kspawn
    file_sd_configs:
      - files: ['/etc/prometheus/targets/klab-kspawn.json']
        refresh_interval: 30s

  # ── Kubernetes cluster observability ──────────────────────────────────
  # kube-cluster used to hardcode cp/worker IPs here. Broke on every
  # install because node IPs come from DHCP. Now the target JSONs are
  # regenerated from `kubectl get nodes -o wide` after cluster bootstrap
  # (and every 30s thereafter by klab-prom-targets).
  #
  # Stock grafana.com dashboards (16611/16612/16613) filter by
  # {k8s_app="cilium"} and {pod=~"$pod"} / {io_cilium_app="operator"}.
  # Those labels are synthesized into each JSON target by
  # klab-prom-targets so the upstream dashboards light up unchanged.
  - job_name: cilium-agent
    file_sd_configs:
      - files: ['/etc/prometheus/targets/cilium-agent.json']
        refresh_interval: 30s
  - job_name: cilium-operator
    file_sd_configs:
      - files: ['/etc/prometheus/targets/cilium-operator.json']
        refresh_interval: 30s
  - job_name: hubble-metrics
    file_sd_configs:
      - files: ['/etc/prometheus/targets/hubble-metrics.json']
        refresh_interval: 30s
  - job_name: tetragon
    file_sd_configs:
      - files: ['/etc/prometheus/targets/tetragon.json']
        refresh_interval: 30s
  - job_name: kubelet
    file_sd_configs:
      - files: ['/etc/prometheus/targets/kubelet.json']
        refresh_interval: 30s
    # kubelet serves metrics over HTTPS with a self-signed cert; skip
    # verify inside the lab (prometheus doesn't have the kube CA chain).
    scheme: https
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/lib/kldload/kubelet-token

  # ── observability-stack ──────────────────────────────────────────────
  # zfs_exporter — per-pool/dataset ARC, fragmentation, compression
  - job_name: zfs-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9134']
        labels:
          instance: kldload-node

  # smartctl_exporter — SMART attributes per physical disk
  - job_name: smartctl-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ['localhost:9633']
        labels:
          instance: kldload-node

  # promtail self-metrics (log-shipper health)
  - job_name: promtail
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9080']
        labels:
          instance: kldload-node

  # ebpf_exporter — per-device block I/O latency histograms
  - job_name: ebpf-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9435']
        labels:
          instance: kldload-node
