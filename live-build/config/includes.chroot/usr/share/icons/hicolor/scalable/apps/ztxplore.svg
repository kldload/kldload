<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="OpenZFS Test Lab">
  <!--
    ztxplore — the OpenZFS test lab.

    The motif is the family's: kldload's storage tools are drawn as stacked
    plates (a pool), which zxplore already uses. This one adds what makes it
    a TEST lab rather than a storage console: the Z cut through the stack,
    and a probe reading it. Blue is this app's accent, distinct from
    zxplore's teal and vmxplore's red so the three are separable on a dock.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4f9ee6"/>
      <stop offset="100%" stop-color="#2c6ea8"/>
    </linearGradient>
    <linearGradient id="zed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2c6ea8"/>
      <stop offset="100%" stop-color="#1c4f7a"/>
    </linearGradient>
  </defs>

  <!-- the pool: three plates, back to front -->
  <g opacity="0.95">
    <ellipse cx="64" cy="90" rx="40" ry="13" fill="url(#plate)" opacity="0.45"/>
    <ellipse cx="64" cy="76" rx="40" ry="13" fill="url(#plate)" opacity="0.7"/>
    <ellipse cx="64" cy="62" rx="40" ry="13" fill="url(#plate)"/>
  </g>

  <!-- the Z: what is under test, cut through the stack -->
  <path d="M42 36 H86 L54 66 H88"
        fill="none" stroke="url(#zed)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the probe: a trace line reading the stack, with its sample point -->
  <path d="M26 106 h14 l6 -12 l7 22 l6 -16 l5 6 h32"
        fill="none" stroke="#4cc38a" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="53" cy="100" r="3.6" fill="#4cc38a"/>
</svg>
