# 10-kldload-only-with-a-bmc.conf — the Debian/Ubuntu spelling of the guard
# that already exists for ipmi.service.
#
# Same defect, same fix, different unit name. Fedora calls it ipmi.service and
# got this drop-in on 2026-09-02; Debian and Ubuntu call it openipmi.service
# and got nothing, so a Debian box with no BMC still boots with a permanently
# failed unit. Unit names differing by family is a trap this project has been
# caught by before — ssh.service versus sshd.service is the other one — and a
# guard written for one spelling is a no-op on the other half of the matrix.
#
# HISTORY: fiend, 2026-09-21, deb-1-core on build 50. `openipmi.service —
# exit-code` was the single defect on an otherwise clean core install. It
# showed up on core first for a second reason worth knowing: the Debian
# "disable the inert units" loop in profiles.sh sits BELOW core's early return
# in k_install_system_files, so core never reaches it. This drop-in does not
# depend on that — the carry loop runs above the early return and globs both
# systemd trees, so it lands on every profile.
#
# The condition is the same one, and it is distro-agnostic: DMI type 38 is
# "IPMI Device Information", published by firmware when a BMC is present,
# before any ipmi module loads. An unmet condition SKIPS a unit rather than
# failing it, so `systemctl --failed` stays empty and `systemctl status
# openipmi` still says plainly that the condition was not met.
#
# The cost of not doing this is the one the Fedora drop-in already names: a
# box that always shows one failed unit teaches its operator to stop reading
# `systemctl --failed`, and the next failure is the one that matters.
#
# NOTE: like its Fedora twin, the PASSING direction is unverified — no machine
# with a BMC has been tested. If a server ever shows openipmi.service skipped
# while ipmitool works, this condition is the first thing to look at.
[Unit]
ConditionPathExists=/sys/firmware/dmi/entries/38-0
