# 10-kldload-only-with-a-bmc.conf — do not fail on hardware that has no BMC.
#
# Fedora enables ipmi.service by preset, and on a machine with no baseboard
# management controller /usr/libexec/openipmi-helper exits 1 with the single
# word "Startup failed." That leaves a permanently failed unit on every
# desktop and workstation kldload installs on — and a box that always shows
# one failed unit teaches its operator to stop reading `systemctl --failed`,
# which is the actual cost. The next failure is the one that matters and
# nobody looks.
#
# DMI type 38 is "IPMI Device Information" and is exactly the right question:
# firmware publishes it when a BMC is present, before any ipmi module is
# loaded. That avoids the chicken-and-egg of testing for /dev/ipmi*, which
# only appears AFTER this unit has done its work.
#
# Measured on fiend, 2026-09-02: chassis_type 3 (desktop), product
# "System Product Name", DMI entries 0-0 1-0 10-0 11-0 12-0 13-0 16-0 17-x
# 18-0 127-0 — and no 38-0. /dev/ipmi* absent, zero ipmi modules loaded.
#
# On a real server the entry exists, the condition is satisfied, and this
# drop-in changes nothing. An unmet condition SKIPS a unit rather than
# failing it, so `systemctl --failed` stays empty and `systemctl status ipmi`
# still says plainly that the condition was not met.
#
# NOTE: not yet exercised on hardware WITH a BMC — the passing direction of
# this gate is unverified. If a server ever shows ipmi.service skipped while
# ipmitool works, this condition is what to look at first.
[Unit]
ConditionPathExists=/sys/firmware/dmi/entries/38-0
