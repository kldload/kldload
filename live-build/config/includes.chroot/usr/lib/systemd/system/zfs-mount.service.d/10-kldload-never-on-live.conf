# 10-kldload-never-on-live.conf — do not mount a target's filesystems over the
# live installer.
#
# zfs-mount.service is `zfs mount -a`: it mounts EVERY dataset of every imported
# pool at whatever its mountpoint property says. On an installed system that is
# exactly right and this drop-in does nothing. On the live medium it is a
# loaded gun, because a machine being reinstalled usually already holds an
# rpool whose datasets claim /, /home, /usr/local, /var/log and /root.
#
# HISTORY: fiend, 2026-09-02. The live ISO booted, the previous install's rpool
# was imported, and zfs-mount mounted it over the running live environment —
# rpool/ROOT/kldload-node on /, rpool/home on /home, rpool/usr/local on
# /usr/local. The installer then ran inside a half-old, half-live filesystem:
# it wrote its own log into the OLD pool's /var/log, /home/live vanished so
# Chrome's profile disappeared and the UI froze, kldload-webui restarted when
# its files were swapped underneath it, and the install stopped before it ever
# reached the wipe. The disk was never touched, so nothing was lost -- but the
# session was unrecoverable without exporting the pool by hand.
#
# The wipe logic in storage-zfs.sh is correct and would have destroyed the pool
# properly; it simply never got that far. This is what has to be prevented
# EARLIER: the installer must never be standing on the disk it is about to
# repartition.
#
# ConditionPathExists=!/run/initramfs/live — dracut's live boot mounts the ISO
# there, so the path exists on the live medium and on nothing else. An
# unsatisfied condition skips the unit without failing it, which is the wanted
# behaviour: no error, no mount.
[Unit]
ConditionPathExists=!/run/initramfs/live
