# 60-kldload-cursor.conf — tell GLFW/SDL apps what cursor the desktop uses.
#
# READ BY: systemd's user environment generator, so every app the graphical
# session launches inherits it. WRITTEN BY: nobody at runtime — this is a
# static default matching the dconf keys in
# /etc/dconf/db/local.d/00-kldload-desktop.
#
# WHY THIS EXISTS: GTK and Qt ask the settings daemon what the cursor theme and
# size are. GLFW does not — it reads XCURSOR_THEME and XCURSOR_SIZE from the
# environment and nothing else. From its Wayland backend (wl_init.c,
# loadCursorTheme):
#
#     int cursorSize = 16;
#     const char* sizeString = getenv("XCURSOR_SIZE");
#     if (sizeString) { ... cursorSize = ... }
#     ...
#     _glfw.wl.cursorThemeHiDPI = wl_cursor_theme_load(themeName, cursorSize * 2, ...);
#
# With XCURSOR_SIZE unset that is 16, and 32 for the HiDPI variant, against a
# desktop drawing 24. So the pointer changed SIZE the moment it crossed into a
# region where the app sets its own cursor — the title bar and the window edges,
# which are client-side decorations and therefore the app's to draw. Reported on
# fiend 2026-09-02 as "hovering the title bar magnifies the cursor", in all four
# Fyne consoles at once, which is what ruled out app code: vmxplore is the only
# one that sets a cursor and it happened in every one of them.
#
# CONSEQUENCE IF MISSING: cosmetic only — the pointer jumps between 24px and
# 16/32px at window edges. Nothing breaks, it just looks broken.
#
# Keep the size in step with cursor-size in 00-kldload-desktop. GLFW cannot read
# dconf, so these two are the same fact written twice; there is no mechanism
# that would let one derive the other.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
