# Runtime scratch dir for kldload helper scripts (_kgroup, _kbcc-pane,
# bpftrace one-liners, etc). World-writable + sticky so any user can drop
# a .bt or .json there without sudo. Owner: root; mode: 1777 (like /tmp).
# Without this, _kgroup zfsdist / kernel-stress runqlat etc fail with
# "mkdir: cannot create directory '/run/kldload': Permission denied"
# when run by a non-root user (the kldload tmux cockpits — kldload-console
# and kldload-sysdiag — both bind F-keys to _kgroup invocations that
# expect this path).
d /run/kldload 1777 root root - -
